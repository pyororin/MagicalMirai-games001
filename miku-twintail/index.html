<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミクの本体はツインテールである</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101418; color: #d8f4f2; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  h1 { font-size: 16px; margin: 4px 0 0; letter-spacing: .1em; }
  #stage { background: #182028; border: 1px solid #2b3a44; border-radius: 8px; touch-action: none;
           max-width: 100%; }
  #ui { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { background: #39c5bb; color: #06282a; border: 0; border-radius: 6px; padding: 8px 16px;
           font-weight: bold; font-size: 14px; cursor: pointer; }
  button.sub { background: #2b3a44; color: #d8f4f2; }
  button:disabled { opacity: .4; cursor: default; }
  #hint, #meta { font-size: 12px; opacity: .75; text-align: center; }
  #result { white-space: pre-line; font-size: 13px; text-align: center; min-height: 7em; }
  #result b { color: #39c5bb; font-size: 22px; }
  #media { width: 640px; max-width: 100%; }
  #songwrap { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
  select { background: #2b3a44; color: #d8f4f2; border: 1px solid #3a4a55; border-radius: 6px;
           padding: 7px 10px; font-size: 14px; max-width: 60vw; }
  #credit { font-size: 11px; opacity: .6; text-align: center; max-width: 60ch; line-height: 1.7;
            padding-bottom: 8px; }
  #credit a { color: #7fe8e0; }
</style>
  <script type="module" crossorigin src="./assets/index-C1dW8jF2.js"></script>
</head>
<body>
<h1>ミクの本体はツインテールである</h1>
<div id="hint">歌唱中（VOCAL 点灯中）にドラッグして、日常の物にツインテールを 2 本生やす。サビでミク度が自動判定される。</div>
<canvas id="stage" width="900" height="560"></canvas>
<div id="ui">
  <span id="songwrap" hidden>
    <label for="song">曲</label>
    <select id="song"></select>
  </span>
  <span id="control" hidden>
    <button id="play" disabled>▶ 再生</button>
    <button id="pause" class="sub" disabled>⏸ 一時停止</button>
    <button id="rewind" class="sub" disabled>⏮ 巻き戻し</button>
  </span>
  <button id="swap" class="sub">お題交換</button>
  <button id="judge">ミク度判定</button>
  <button id="reset" class="sub">散髪（リセット）</button>
</div>
<div id="meta">読み込み中……</div>
<div id="result"></div>
<div id="media"></div>
<footer id="credit">
  楽曲情報・歌詞の解析データは
  <a href="https://developer.textalive.jp/" target="_blank" rel="noopener">TextAlive App API</a>（産業技術総合研究所）と
  <a href="https://songle.jp/" target="_blank" rel="noopener">Songle</a> を利用しています。
  楽曲の著作権は各権利者に帰属します。
</footer>
</body>
</html>
