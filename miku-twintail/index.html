<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミクの本体はツインテールである</title>
  <script type="module" crossorigin src="./assets/main-DTF2RR1I.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/core-Be1rSJqE.js">
  <link rel="stylesheet" crossorigin href="./assets/core-DzPeseMN.css">
</head>
<body>
<h1>ミクの本体はツインテールである</h1>
<div id="hint">
  四拍子の<b>2拍目で髪留めをタップ</b>し、<b>お題の髪型（黄色い下書き）どおりに伸ばす</b>。
  小節の<b>最後の拍で髪が生えます</b>（離さなくても確定）。左右は<b>音の定位</b>で分かります。
  タップを外すと<b>ネギ</b>、左右を取り違えるとミク度が大きく下がります。
</div>
<canvas id="stage" width="960" height="600"></canvas>
<div id="ui">
  <span id="songwrap" hidden><label for="song">曲</label><select id="song"></select></span>
  <span id="control" hidden>
    <button id="start" disabled>▶ スタート</button>
    <button id="auto" class="sub" disabled>観賞モード</button>
    <button id="pause" class="sub" disabled>⏸ 停止</button>
  </span>
  <span id="diffwrap"><label for="diff">難易度</label>
    <select id="diff">
      <option value="easy">やさしい</option>
      <option value="normal" selected>ふつう</option>
      <option value="hard">むずかしい</option>
    </select></span>
  <label><input type="checkbox" id="guide"> 左右の目印を出す（練習用）</label>
</div>
<div id="meta">読み込み中……</div>
<div id="diag"></div>
<div id="media"></div>
<div id="build"></div>
<footer id="credit">
  楽曲情報・歌詞の解析データは
  <a href="https://developer.textalive.jp/" target="_blank" rel="noopener">TextAlive App API</a>（産業技術総合研究所）と
  <a href="https://songle.jp/" target="_blank" rel="noopener">Songle</a> を利用しています。
  楽曲の著作権は各権利者に帰属します。掛け声はブラウザの音声合成によるもので、初音ミクの音声素材は使用していません。
</footer>
</body>
</html>
