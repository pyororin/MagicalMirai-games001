<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミクの本体はツインテールである — リズム版モック</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1216; color: #d8f4f2; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  h1 { font-size: 15px; margin: 4px 0 0; letter-spacing: .12em; font-weight: 700; }
  #hint { font-size: 12px; opacity: .72; text-align: center; max-width: 66ch; line-height: 1.75; }
  #stage { background: #141c22; border: 1px solid #24333d; border-radius: 10px;
           touch-action: none; max-width: 100%; display: block; cursor: pointer; }
  #ui { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button { background: #39c5bb; color: #06282a; border: 0; border-radius: 7px; padding: 9px 20px;
           font-weight: 700; font-size: 14px; cursor: pointer; }
  button.sub { background: #253039; color: #d8f4f2; }
  label { font-size: 12px; opacity: .8; display: inline-flex; align-items: center; gap: 5px; }
  #build { font-size: 11px; opacity: .45; }
</style>
</head>
<body>
<h1>ミクの本体はツインテールである — リズム版 検証モック</h1>
<div id="hint">
  髪留めが<b>1拍ごとに近づいてきます</b>。到達する<b>4拍目（音が変わる所）でタップ</b> →
  星を伸ばして <b>次の小節アタマでリリース</b>。左右は<b>音の定位</b>で分かります（ヘッドホン推奨）。
</div>
<canvas id="stage" width="960" height="600"></canvas>
<div id="ui">
  <button id="start">▶ スタート</button>
  <button id="auto" class="sub">観賞モード</button>
  <label><input type="checkbox" id="guide"> 目印を出す（練習用）</label>
</div>
<div id="build">build 2 ・ 擬似曲 130BPM（本番は TextAlive の課題曲に置き換え）</div>
<script>
"use strict";
/* =========================================================================
 * ミクの本体はツインテールである — リズムアクション版 検証モック build 2
 *   1体 = 2小節(8拍)。前の体の完成と次の体の開始が同じ拍に重なる
 *   拍は常に鳴り、髪留めの拍(4拍目)と髪の毛の拍(1拍目)で音色が変わる
 * ========================================================================= */

const BPM = 130, BEAT = 60 / BPM;
const CYCLE = 8;                        // 1体 = 8拍(2小節)
const LYRIC = [..."ミクノホンタイハツインテールデアルコエガカタチヲツクル"];
// サイクル内の拍の役割: 3,7 = 髪留め(TAP) / 0,4 = 髪の毛(RELEASE) / 他 = 素の拍
const TAP_BEAT = [3, 7], REL_BEAT = [4, 8];

// ---- 音 -------------------------------------------------------------------
let ac = null, master = null, songGain = null, beatGain = null, sfxGain = null, NOISE = null;
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  // 曲は拍の音を邪魔しない音量に（拍=1.0 に対して 0.8）
  songGain = ac.createGain(); songGain.gain.value = 0.8; songGain.connect(master);
  beatGain = ac.createGain(); beatGain.gain.value = 1.0;  beatGain.connect(master);
  sfxGain  = ac.createGain(); sfxGain.gain.value  = 0.95; sfxGain.connect(master);
  const b = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  NOISE = b;
}
function env(g, at, peak, dur, atk = 0.008) {
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
}
function osc(at, freq, type, peak, dur, dest, pan = 0, atk = 0.008) {
  const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
  o.type = type; o.frequency.setValueAtTime(freq, at); p.pan.value = pan;
  env(g, at, peak, dur, atk);
  o.connect(g); g.connect(p); p.connect(dest); o.start(at); o.stop(at + dur + 0.06);
  return o;
}
// --- 曲パート（songGain 経由 = 拍より控えめ）---
function kick(at) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(150, at);
  o.frequency.exponentialRampToValueAtTime(45, at + 0.1);
  env(g, at, 0.6, 0.16, 0.004);
  o.connect(g); g.connect(songGain); o.start(at); o.stop(at + 0.28);
}
function snare(at) {
  const s = ac.createBufferSource(); s.buffer = NOISE;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 0.8;
  const g = ac.createGain(); env(g, at, 0.22, 0.13, 0.002);
  s.connect(f); f.connect(g); g.connect(songGain); s.start(at); s.stop(at + 0.2);
}
const SCALE = [0, 2, 3, 5, 7, 8, 10];                    // 自然的短音階
const RIFF = [7, 10, 12, 10, 7, 5, 3, 5];                // 8拍のリフ
const BASS = [0, 0, -5, -5, -7, -7, -3, -3];
const CHORD = [[0, 3, 7], [0, 3, 7], [-5, -1, 2], [-5, -1, 2],
               [-7, -3, 0], [-7, -3, 0], [-3, 0, 4], [-3, 0, 4]];
function songBeat(b, at) {
  const i = b % 8, inBar = b % 4;
  if (inBar === 0 || (inBar === 2 && i % 8 !== 6)) kick(at);
  if (inBar === 2) snare(at);
  osc(at, 55 * Math.pow(2, BASS[i] / 12), "triangle", 0.16, BEAT * 0.9, songGain);
  if (inBar === 0) for (const st of CHORD[i])
    osc(at, 220 * Math.pow(2, st / 12), "sawtooth", 0.028, BEAT * 1.8, songGain, 0, 0.04);
  osc(at, 440 * Math.pow(2, RIFF[i] / 12), "square", 0.045, BEAT * 0.42, songGain, -0.25);
  if (i % 2 === 1) osc(at + BEAT / 2, 440 * Math.pow(2, RIFF[(i + 1) % 8] / 12),
                       "square", 0.028, BEAT * 0.3, songGain, 0.25);
}
// --- 拍の音（beatGain 経由 = はっきり前に出す）---
/** 素の拍。1・2拍目などの土台 */
function click(at, strong) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "square"; o.frequency.setValueAtTime(strong ? 900 : 1250, at);
  o.frequency.exponentialRampToValueAtTime(strong ? 420 : 700, at + 0.03);
  env(g, at, strong ? 0.17 : 0.10, 0.05, 0.002);
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.6;
  f.frequency.value = strong ? 900 : 1400;
  o.connect(f); f.connect(g); g.connect(beatGain); o.start(at); o.stop(at + 0.12);
}
/** 髪留めの拍（4拍目・TAP）: 硬く高い「カンッ」。ここで打つ */
function tieBeat(at, pan) {
  const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(beatGain);
  for (const [f, v, d] of [[2093, 0.20, 0.34], [3136, 0.10, 0.24], [4186, 0.05, 0.16]])
    osc(at, f, "sine", v, d, p, 0, 0.002);
  const s = ac.createBufferSource(); s.buffer = NOISE;
  const bf = ac.createBiquadFilter(); bf.type = "highpass"; bf.frequency.value = 6000;
  const g = ac.createGain(); env(g, at, 0.10, 0.05, 0.001);
  s.connect(bf); bf.connect(g); g.connect(p); s.start(at); s.stop(at + 0.1);
}
/** 髪の毛の拍（1拍目・RELEASE）: やわらかく低い「ポワーン」。髪留めと明確に対比させる */
function hairBeat(at, pan) {
  const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(beatGain);
  for (const [f, v, d] of [[784, 0.17, 0.5], [1176, 0.07, 0.4], [392, 0.09, 0.55]])
    osc(at, f, "triangle", v, d, p, 0, 0.02);
}
// --- 効果音（sfxGain 経由）---
function shimmer(at, dur, pan) {
  const g = ac.createGain(); g.gain.value = 1;
  const p = ac.createStereoPanner(); p.pan.value = pan;
  g.connect(p); p.connect(sfxGain);
  const st = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24], n = 11, step = dur / n;
  for (let i = 0; i < n; i++)
    osc(at + i * step, 523.25 * Math.pow(2, st[i] / 12), "sine", 0.10, step * 2.4, g, 0, 0.004);
  return g;
}
function shakin(at, pan) {
  const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(sfxGain);
  const s = ac.createBufferSource(); s.buffer = NOISE;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 2.5;
  f.frequency.setValueAtTime(2500, at);
  f.frequency.exponentialRampToValueAtTime(7000, at + 0.09);
  const g = ac.createGain(); env(g, at, 0.3, 0.42, 0.003);
  s.connect(f); f.connect(g); g.connect(p); s.start(at); s.stop(at + 0.6);
  const o = ac.createOscillator(), og = ac.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(3400, at);
  o.frequency.exponentialRampToValueAtTime(1900, at + 0.3);
  env(og, at, 0.16, 0.38, 0.003);
  o.connect(og); og.connect(p); o.start(at); o.stop(at + 0.5);
}
function flop(at) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(320, at);
  o.frequency.exponentialRampToValueAtTime(70, at + 0.25);
  env(g, at, 0.12, 0.3, 0.006);
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
  o.connect(f); f.connect(g); g.connect(sfxGain); o.start(at); o.stop(at + 0.4);
}
function say(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 1.3; u.pitch = 1.8; u.volume = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---- 進行 -------------------------------------------------------------------
let startAt = 0, nextBeat = 0, schedTimer = null;
const songTime = () => (ac ? ac.currentTime - startAt : 0);
const bt = b => b * BEAT;
const rnd01 = n => { let h = Math.sin(n * 12.9898) * 43758.5453; return h - Math.floor(h); };
/** サイクル c の i 番目に打つ房。順序は毎回入れ替わる＝耳で聞く必要がある */
const sideOf = (c, i) => (rnd01(c) < 0.5 ? ["L", "R"] : ["R", "L"])[i];
const absTap = (c, i) => c * CYCLE + TAP_BEAT[i];
const absRel = (c, i) => c * CYCLE + REL_BEAT[i];

function scheduleBeat(b) {
  const at = startAt + bt(b);
  songBeat(b, at);
  const c = Math.floor(b / CYCLE), i = b % CYCLE;
  if (i === 3 || i === 7) {                       // 髪留めの拍
    tieBeat(at, sideOf(c, i === 3 ? 0 : 1) === "L" ? -0.8 : 0.8);
  } else if (i === 0 || i === 4) {                // 髪の毛の拍（0 は前サイクル2房目の解決）
    const s = i === 0 ? sideOf(c - 1, 1) : sideOf(c, 0);
    hairBeat(at, s === "L" ? -0.55 : 0.55);
  } else {
    click(at, false);
  }
}
function scheduler() { while (bt(nextBeat) < songTime() + 0.25) { scheduleBeat(nextBeat); nextBeat++; } }

// ---- お題オブジェクト -------------------------------------------------------
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }
const OBJECTS = [
  { name: "ネギ", w: 54, h: 150, draw(g) {
      g.fillStyle = "#eef6e2"; rr(g, -20, 10, 40, 66, 8);
      g.fillStyle = "#6fbf4a"; rr(g, -17, -76, 12, 92, 6); rr(g, -3, -84, 12, 100, 6); rr(g, 11, -70, 11, 86, 6);
      g.fillStyle = "#d9e7c4"; rr(g, -20, 6, 40, 8, 4); } },
  { name: "ペットボトル", w: 62, h: 150, draw(g) {
      g.fillStyle = "#c7e7f5"; rr(g, -31, -30, 62, 106, 14);
      g.beginPath(); g.moveTo(-31, -26); g.lineTo(-13, -58); g.lineTo(13, -58); g.lineTo(31, -26); g.fill();
      g.fillStyle = "#fff"; rr(g, -26, 4, 52, 34, 4);
      g.fillStyle = "#2f89a8"; rr(g, -12, -76, 24, 20, 4); } },
  { name: "炊飯器", w: 118, h: 104, draw(g) {
      g.fillStyle = "#eceff1"; rr(g, -59, -52, 118, 104, 20);
      g.fillStyle = "#c3ccd2"; rr(g, -59, -52, 118, 30, 15);
      g.fillStyle = "#39c5bb"; g.beginPath(); g.arc(0, 12, 9, 0, 7); g.fill();
      g.fillStyle = "#98a4ab"; rr(g, -16, -60, 32, 10, 5); } },
  { name: "マグカップ", w: 96, h: 100, draw(g) {
      g.strokeStyle = "#b8895a"; g.lineWidth = 12;
      g.beginPath(); g.arc(52, 4, 26, -1.2, 1.2); g.stroke();
      g.fillStyle = "#d9a06b"; rr(g, -44, -50, 88, 100, 12);
      g.fillStyle = "#6b4423"; g.beginPath(); g.ellipse(0, -46, 39, 8, 0, 0, 7); g.fill(); } },
  { name: "郵便ポスト", w: 76, h: 150, draw(g) {
      g.fillStyle = "#d6423e"; rr(g, -38, -60, 76, 136, 10);
      g.beginPath(); g.arc(0, -60, 38, Math.PI, 0); g.fill();
      g.fillStyle = "#2b1210"; rr(g, -24, -46, 48, 11, 3);
      g.fillStyle = "#a8302d"; rr(g, -30, 26, 60, 26, 4); } },
  { name: "目覚まし時計", w: 104, h: 104, draw(g) {
      g.fillStyle = "#f2c519"; g.beginPath(); g.arc(-32, -42, 15, 0, 7); g.arc(32, -42, 15, 0, 7); g.fill();
      g.fillStyle = "#e9b400"; g.beginPath(); g.arc(0, 0, 52, 0, 7); g.fill();
      g.fillStyle = "#fffdf2"; g.beginPath(); g.arc(0, 0, 41, 0, 7); g.fill();
      g.strokeStyle = "#31261a"; g.lineWidth = 4; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -26); g.moveTo(0, 0); g.lineTo(19, 9); g.stroke(); } },
];
const objOf = c => OBJECTS[Math.floor(rnd01(c * 3.7) * OBJECTS.length) % OBJECTS.length];

// ---- 状態 -------------------------------------------------------------------
const cv = document.getElementById("stage"), cx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const MAIN_SCALE = 1.75, GROUND_Y = 452;
const ANCHOR = { L: { x: -0.44, y: -0.44 }, R: { x: 0.44, y: -0.44 } };
let running = false, autoPlay = false, showGuide = false;
let units = [], slide = null, shimmerGain = null;
let gallery = [], score = 0, combo = 0, maxCombo = 0, flash = null, effects = [];

function makeUnit(c) {
  return { c, obj: objOf(c), order: [sideOf(c, 0), sideOf(c, 1)],
           tails: { L: null, R: null }, done: { L: false, R: false },
           judged: false, autoFired: { L: false, R: false } };
}
const unitOf = c => units.find(u => u.c === c);
/** そのユニットの中心 X。完成間際の体と開始したての体が重ならないよう少しずらす */
const unitX = () => W / 2;
function anchorOf(u, side) {
  const s = MAIN_SCALE;
  return { x: unitX() + ANCHOR[side].x * u.obj.w * s,
           y: GROUND_Y - u.obj.h * s / 2 + ANCHOR[side].y * u.obj.h * s };
}

// ---- 判定 -------------------------------------------------------------------
const GRADE = { PERFECT: { s: 100, label: "PERFECT", col: "#ffe66d" },
                GOOD:    { s: 60,  label: "GOOD",    col: "#7fe8e0" },
                MISS:    { s: 0,   label: "MISS",    col: "#ff7a8a" } };
const grade = d => { const a = Math.abs(d); return a <= 0.11 ? "PERFECT" : a <= 0.24 ? "GOOD" : "MISS"; };
function pop(text, col, x, y) { effects.push({ text, col, x, y, t: songTime() }); }

function onDown(px, py) {
  const t = songTime();
  let best = null;
  for (const u of units) for (let i = 0; i < 2; i++) {
    const side = u.order[i];
    if (u.done[side]) continue;
    const d = (t - bt(absTap(u.c, i))) / BEAT;
    if (Math.abs(d) < 0.55 && (!best || Math.abs(d) < Math.abs(best.d))) best = { u, i, side, d };
  }
  if (!best) { flop(ac.currentTime); combo = 0; pop("そこじゃない", "#ff7a8a", px, py); return; }
  const g = grade(best.d);
  if (g === "MISS") { flop(ac.currentTime); combo = 0; best.u.done[best.side] = true;
                      pop(best.d < 0 ? "早い" : "遅い", "#ff7a8a", px, py); return; }
  const pan = best.side === "L" ? -0.7 : 0.7;
  osc(ac.currentTime, 520, "sine", 0.13, 0.1, sfxGain, pan);
  shimmerGain = shimmer(ac.currentTime, BEAT, pan);
  const a = anchorOf(best.u, best.side);
  slide = { u: best.u, i: best.i, side: best.side, tapGrade: g, x0: a.x, y0: a.y, x: px, y: py };
  pop(GRADE[g].label, GRADE[g].col, a.x, a.y - 26);
}
const onMove = (px, py) => { if (slide) { slide.x = px; slide.y = py; } };
function onUp() {
  if (!slide) return;
  const t = songTime(), s = slide; slide = null;
  if (shimmerGain) { shimmerGain.gain.setTargetAtTime(0.0001, ac.currentTime, 0.02); shimmerGain = null; }
  const d = (t - bt(absRel(s.u.c, s.i))) / BEAT;
  let g = grade(d);
  const dx = s.x - s.x0, dy = s.y - s.y0, dist = Math.hypot(dx, dy);
  const wrong = (s.side === "L" && dx > 40) || (s.side === "R" && dx < -40);
  if (dist < 30) { g = "MISS"; pop("伸びてない", "#ff7a8a", s.x, s.y); }
  else if (wrong) { g = "MISS"; pop("逆！", "#ff7a8a", s.x, s.y); }
  else pop(GRADE[g].label, GRADE[g].col, s.x, s.y);
  s.u.done[s.side] = true;
  if (g === "MISS") { flop(ac.currentTime); combo = 0; }
  else {
    shakin(ac.currentTime, s.side === "L" ? -0.6 : 0.6);
    combo++; maxCombo = Math.max(maxCombo, combo);
    score += Math.round((GRADE[s.tapGrade].s + GRADE[g].s) * (1 + Math.min(combo, 20) / 20));
    s.u.tails[s.side] = { angle: Math.atan2(dy, dx), len: Math.min(dist, 250),
                          quality: (GRADE[s.tapGrade].s + GRADE[g].s) / 200,
                          chars: LYRIC.slice(Math.floor(rnd01(s.u.c + s.i) * 20)).slice(0, 7) };
  }
}

// ---- ユニットの完成 ---------------------------------------------------------
function finish(u) {
  u.judged = true;
  const L = u.tails.L, R = u.tails.R, q = (L ? L.quality : 0) + (R ? R.quality : 0);
  let text, label;
  if (L && R && q >= 1.9)      { text = "ミクーッ！"; label = "本人"; }
  else if (L && R && q >= 1.4) { text = "ミク！";     label = "ほぼミク"; }
  else if (L && R)             { text = "ミク。";     label = "ミク見習い"; }
  else if (L || R)             { text = "ミク？";     label = "片ツインテール"; }
  else                         { text = "だれ？";     label = "ただの" + u.obj.name; }
  say(text);
  flash = { text, label, t: songTime() };
  // 背景へはランダムな位置・大きさで散らす
  const n = gallery.length;
  gallery.push({ obj: u.obj, tails: u.tails,
                 x: 60 + rnd01(u.c * 5.1) * (W - 120),
                 y: 78 + rnd01(u.c * 9.3) * 210,
                 s: 0.26 + rnd01(u.c * 2.4) * 0.12,
                 seed: n });
}

function tick() {
  if (!running) return;
  const t = songTime();
  scheduler();
  const c = Math.floor(t / BEAT / CYCLE);
  if (!unitOf(c)) units.push(makeUnit(c));
  for (const u of units) {
    for (let i = 0; i < 2; i++) {                       // 打ち逃し
      const side = u.order[i];
      if (!u.done[side] && t > bt(absTap(u.c, i)) + BEAT * 0.55 && !(slide && slide.side === side && slide.u === u)) {
        u.done[side] = true; combo = 0; flop(ac.currentTime);
        pop("スルー", "#ff7a8a", anchorOf(u, side).x, anchorOf(u, side).y);
      }
    }
    // 2房目のリリース拍 = このユニットの完成。次のユニットはもう始まっている
    if (!u.judged && t >= bt(absRel(u.c, 1)) + BEAT * 0.3) finish(u);
  }
  units = units.filter(u => !u.judged);
  if (autoPlay) autoTick(t);
}

// ---- 観賞モード -------------------------------------------------------------
function autoTick(t) {
  for (const u of units) for (let i = 0; i < 2; i++) {
    const side = u.order[i], a = anchorOf(u, side), out = side === "L" ? -1 : 1;
    if (!u.autoFired[side] && !u.done[side] && !slide && t >= bt(absTap(u.c, i))) {
      u.autoFired[side] = true; onDown(a.x, a.y);
    }
    if (slide && slide.u === u && slide.side === side) {
      const p = Math.min(1, (t - bt(absTap(u.c, i))) / BEAT);
      onMove(a.x + out * 78 * p, a.y + 150 * p);
      if (t >= bt(absRel(u.c, i))) onUp();
    }
  }
}

// ---- 描画 -------------------------------------------------------------------
function tailPath(ax, ay, tail, t, N = 16) {
  const { angle, len } = tail, outward = Math.cos(angle) < 0 ? -1 : 1;
  const rootAngle = -Math.PI / 2 + outward * 0.42;
  let fall = angle;
  const minA = 0.22, maxA = Math.PI - 0.22;
  if (Math.sin(fall) < Math.sin(minA)) fall = outward > 0 ? minA : maxA;
  const step = len / N, pts = []; let x = ax, y = ay;
  for (let i = 0; i <= N; i++) {
    pts.push({ x, y });
    const u = i / N, r = Math.min(1, u / 0.22), k = r * r * (3 - 2 * r);
    let d = fall - rootAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const a = rootAngle + d * k + 0.5 * Math.max(0, u - 0.5) + Math.sin(t * 2 + u * 2.5) * 0.02 * u;
    x += Math.cos(a) * step; y += Math.sin(a) * step;
  }
  return { pts, rootAngle, N };
}
function drawTail(g, ax, ay, tail, t, alpha = 1, sc = 1) {
  const { pts, rootAngle, N } = tailPath(ax, ay, { ...tail, len: tail.len * sc }, t);
  const light = 40 + 16 * tail.quality;
  const grad = g.createLinearGradient(ax, ay, pts[N].x, pts[N].y);
  grad.addColorStop(0, `hsl(174 62% ${light + 12}%)`);
  grad.addColorStop(1, `hsl(176 55% ${light - 14}%)`);
  const halfW = i => { const u = i / N;
    return (15 * Math.sin(Math.min(u * 2.8, 1) * Math.PI / 2) * Math.pow(1 - u, 0.9) + 0.5) * sc; };
  const norm = i => { const p = pts[Math.max(0, i - 1)], q = pts[Math.min(N, i + 1)];
    const nx = -(q.y - p.y), ny = q.x - p.x, d = Math.hypot(nx, ny) || 1; return { x: nx / d, y: ny / d }; };
  g.save(); g.globalAlpha *= alpha;
  g.beginPath();
  for (let i = 0; i <= N; i++) { const n = norm(i), w = halfW(i);
    const px = pts[i].x + n.x * w, py = pts[i].y + n.y * w;
    i === 0 ? g.moveTo(px, py) : g.lineTo(px, py); }
  for (let i = N; i >= 0; i--) { const n = norm(i), w = halfW(i);
    g.lineTo(pts[i].x - n.x * w, pts[i].y - n.y * w); }
  g.closePath(); g.fillStyle = grad; g.fill();
  g.strokeStyle = "hsl(178 60% 17%)"; g.lineWidth = 1.2 * sc; g.stroke();
  g.strokeStyle = `rgba(220,255,252,${0.16 + 0.22 * tail.quality})`; g.lineWidth = 2.4 * sc;
  g.beginPath();
  for (let i = 1; i < N - 2; i++) { const n = norm(i), w = halfW(i) * 0.45;
    const px = pts[i].x + n.x * w, py = pts[i].y + n.y * w;
    i === 1 ? g.moveTo(px, py) : g.lineTo(px, py); }
  g.stroke();
  if (sc > 0.55) {
    g.fillStyle = "rgba(228,255,253,.75)"; g.font = "10px sans-serif"; g.textAlign = "center";
    (tail.chars || []).forEach((ch, i) => { const p = pts[Math.min(N, 3 + i * 2)]; if (p) g.fillText(ch, p.x, p.y + 3); });
  }
  drawTie(g, ax, ay, rootAngle, sc);
  g.restore();
}
function drawTie(g, x, y, rot, scale = 1) {
  g.save(); g.translate(x, y); g.rotate(rot + Math.PI / 2); g.scale(scale, scale);
  g.fillStyle = "#222831"; rr(g, -9, -10, 18, 20, 3);
  g.strokeStyle = "#3d4756"; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = "rgba(236,64,142,.95)"; rr(g, -4.5, -5.5, 9, 11, 2);
  g.restore();
}
function drawObject(g, o, x, y, scale, tails, t) {
  g.save(); g.translate(x, y); g.scale(scale, scale);
  o.draw(g);
  g.restore();
  for (const side of ["L", "R"]) if (tails && tails[side])
    drawTail(g, x + ANCHOR[side].x * o.w * scale, y + ANCHOR[side].y * o.h * scale,
             tails[side], t, 1, scale);
}

/** 髪留めが1拍ごとに近づく。連続移動ではなく拍で刻むので、拍を数える助けになる */
function drawApproach(g, u, i, t) {
  const side = u.order[i];
  if (u.done[side] || (slide && slide.u === u && slide.side === side)) return;
  const target = bt(absTap(u.c, i));
  const left = (target - t) / BEAT;                 // 残り拍数
  if (left > 3.4 || left < -0.5) return;
  const stepsLeft = Math.max(0, Math.ceil(left - 0.001));   // 拍ごとに離散でジャンプ
  const frac = Math.max(0, Math.min(1, left - stepsLeft + 1));
  const a = anchorOf(u, side), out = side === "L" ? -1 : 1;
  const dist = stepsLeft * 108;
  const bounce = Math.sin(Math.min(1, (1 - frac) * 3) * Math.PI) * 7;  // 着地ごとに弾む
  const x = a.x + out * dist, y = a.y - dist * 0.5 - bounce;
  const near = 1 - stepsLeft / 3.4;
  g.save();
  g.globalAlpha = 0.35 + 0.65 * near;
  // 髪留めの後ろに、これから生える房の影がついてくる
  drawTail(g, x, y, { angle: Math.atan2(1, out * 0.5), len: 34 + 30 * near, quality: 0, chars: [] },
           t, 0.22 + 0.2 * near);
  drawTie(g, x, y, -Math.PI / 2 + out * 0.42, 0.85 + 0.25 * near);
  if (stepsLeft === 0) {                            // 到達＝いま打つ拍
    g.globalAlpha = 1;
    g.strokeStyle = "#ffe66d"; g.lineWidth = 3;
    g.beginPath(); g.arc(x, y, 20 + frac * 14, 0, 7); g.stroke();
  }
  if (showGuide) {
    g.globalAlpha = 1; g.fillStyle = "#ffe66d"; g.font = "bold 13px sans-serif"; g.textAlign = "center";
    g.fillText(side === "L" ? "◀ 左" : "右 ▶", x, y - 26);
  }
  g.restore();
}

function render() {
  const g = cx, t = songTime();
  g.clearRect(0, 0, W, H);
  if (!running) {
    g.fillStyle = "#7fe8e0"; g.font = "bold 20px sans-serif"; g.textAlign = "center";
    g.fillText("▶ スタート を押す", W / 2, H / 2 - 10);
    g.fillStyle = "#8fa6ae"; g.font = "13px sans-serif";
    g.fillText("髪留めが拍ごとに近づく → 到達した4拍目でタップ → 小節アタマで離す", W / 2, H / 2 + 20);
    requestAnimationFrame(render); return;
  }
  // 背景: これまでのミクたち（ランダム配置。ボーカルに合わせて揺れる）
  g.save(); g.globalAlpha = .8;
  for (const it of gallery) {
    const bob = Math.sin(t * Math.PI / BEAT * .5 + it.seed) * (2.5 + combo * .2);
    drawObject(g, it.obj, it.x, it.y + bob, it.s, it.tails, t);
  }
  g.restore();

  // 拍インジケータ。4拍目(髪留め)と1拍目(髪の毛)を色分け
  const inCycle = Math.floor(t / BEAT) % CYCLE, ph = (t / BEAT) % 1;
  for (let i = 0; i < CYCLE; i++) {
    const on = i === inCycle, isTap = i === 3 || i === 7, isRel = i === 0 || i === 4;
    g.fillStyle = on ? (isTap ? "#ffe66d" : isRel ? "#ff8fc0" : "#39c5bb") : "#243039";
    g.beginPath(); g.arc(34 + i * 22, 30, on ? 9 - ph * 2 : 5, 0, 7); g.fill();
  }
  g.fillStyle = "#8fa6ae"; g.font = "11px sans-serif"; g.textAlign = "left";
  g.fillText("● 髪留め(TAP)　● 髪の毛(離す)", 214, 34);
  g.textAlign = "right"; g.fillStyle = "#9fb6bd"; g.font = "12px sans-serif";
  g.fillText(`SCORE ${score}`, W - 20, 26);
  g.fillText(`COMBO ${combo}${maxCombo ? "  (MAX " + maxCombo + ")" : ""}`, W - 20, 44);

  // 進行中のユニット
  for (const u of units) {
    if (u.judged) continue;
    const born = bt(u.c * CYCLE), rise = Math.min(1, (t - born) / (BEAT * 1.2));
    // 2房目のリリースを過ぎたら、完成体は縮みながら背景へ飛んでいく
    const exit = Math.max(0, Math.min(1, (t - bt(absRel(u.c, 1))) / (BEAT * 0.45)));
    const oy = GROUND_Y - u.obj.h * MAIN_SCALE / 2 + (1 - rise) * 70 - exit * 120;
    g.save(); g.globalAlpha = Math.max(0, rise) * (1 - exit * 0.9);
    if (exit > 0) { g.translate(unitX(), oy); g.scale(1 - exit * 0.5, 1 - exit * 0.5); g.translate(-unitX(), -oy); }
    // タップ受付範囲（オブジェクトの左右の広い帯。実際はどこを触っても判定する）
    const active = u.order.some((s, i) => !u.done[s] && Math.abs(t - bt(absTap(u.c, i))) < BEAT * 1.2);
    if (active) {
      g.fillStyle = "rgba(57,197,187,.05)";
      rr(g, unitX() - u.obj.w * MAIN_SCALE / 2 - 190, oy - u.obj.h * MAIN_SCALE / 2 - 40, 190, u.obj.h * MAIN_SCALE + 80, 14);
      rr(g, unitX() + u.obj.w * MAIN_SCALE / 2, oy - u.obj.h * MAIN_SCALE / 2 - 40, 190, u.obj.h * MAIN_SCALE + 80, 14);
    }
    drawObject(g, u.obj, unitX(), oy, MAIN_SCALE, u.tails, t);
    g.restore();
    for (let i = 0; i < 2; i++) drawApproach(g, u, i, t);
    if (u === units[units.length - 1]) {
      g.fillStyle = "#5f7681"; g.font = "12px sans-serif"; g.textAlign = "center";
      g.fillText("お題: " + u.obj.name, W / 2, 26);
    }
  }

  // スライド中の星（歌詞の文字）
  if (slide) {
    g.strokeStyle = "rgba(127,232,224,.5)"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(slide.x0, slide.y0); g.lineTo(slide.x, slide.y); g.stroke();
    for (let i = 0; i < 9; i++) {
      const u = (i + (t * 2.4 % 1)) / 9;
      g.fillStyle = `rgba(255,246,190,${1 - u})`; g.font = `${14 - u * 4}px sans-serif`;
      g.textAlign = "center";
      g.fillText(LYRIC[(i + Math.floor(t * 6)) % LYRIC.length],
                 slide.x0 + (slide.x - slide.x0) * u, slide.y0 + (slide.y - slide.y0) * u);
    }
  }
  effects = effects.filter(e => t - e.t < .7);
  g.textAlign = "center";
  for (const e of effects) {
    const u = (t - e.t) / .7;
    g.globalAlpha = 1 - u; g.fillStyle = e.col; g.font = "bold 17px sans-serif";
    g.fillText(e.text, e.x, e.y - u * 26); g.globalAlpha = 1;
  }
  if (flash && t - flash.t < 1.2) {
    const u = (t - flash.t) / 1.2, s = 1 + (1 - Math.min(1, u * 5)) * .5;
    g.save(); g.translate(W / 2, 150); g.scale(s, s); g.globalAlpha = Math.min(1, (1 - u) * 3);
    g.fillStyle = "#ffe66d"; g.font = "bold 48px sans-serif"; g.fillText(flash.text, 0, 0);
    g.fillStyle = "#7fe8e0"; g.font = "bold 15px sans-serif"; g.fillText(flash.label, 0, 28);
    g.restore();
  }
  requestAnimationFrame(render);
}

// ---- 入力 -------------------------------------------------------------------
function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener("pointerdown", e => {
  if (!running) return; e.preventDefault(); autoPlay = false;
  cv.setPointerCapture(e.pointerId); const p = pos(e); onDown(p.x, p.y);
});
cv.addEventListener("pointermove", e => { if (slide) { const p = pos(e); onMove(p.x, p.y); } });
cv.addEventListener("pointerup", () => onUp());
cv.addEventListener("pointercancel", () => onUp());
document.getElementById("start").onclick = () => {
  initAudio(); ac.resume();
  startAt = ac.currentTime + 0.15; nextBeat = 0;
  running = true; units = [makeUnit(0)]; gallery = []; score = 0; combo = 0; maxCombo = 0;
  clearInterval(schedTimer); schedTimer = setInterval(tick, 16);
};
document.getElementById("auto").onclick = () => {
  if (!running) document.getElementById("start").click();
  autoPlay = !autoPlay;
};
document.getElementById("guide").onchange = e => { showGuide = e.target.checked; };
window.RHYTHM_DEBUG = () => ({ score, combo, maxCombo, mikus: gallery.length,
  units: units.map(u => ({ c: u.c, obj: u.obj.name, order: u.order.join(""),
                           tails: Object.keys(u.tails).filter(k => u.tails[k]).join("") })) });
render();
</script>
</body>
