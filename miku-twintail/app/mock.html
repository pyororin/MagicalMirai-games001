<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミクの本体はツインテールである — 擬似曲モック</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<h1>ミクの本体はツインテールである — 擬似曲モック</h1>
<div id="hint">
  接続版（<a href="./index.html">実曲版はこちら</a>）と<b>まったく同じゲーム本体</b>を、
  自前で合成した 130BPM の擬似曲で動かしています。通信もトークンも不要です。
  <b>□ 髪留め</b>＝タップして次の拍までなぞる（なぞった線が髪になる）／
  <b>〜 髪</b>＝その拍でタップするだけ。
</div>
<canvas id="stage" width="960" height="600"></canvas>
<div id="volume">
  <label for="volSong">楽曲 <output id="volSongOut">50</output>
    <input type="range" id="volSong" min="0" max="100" step="1"></label>
  <label for="volBeat">拍・効果音 <output id="volBeatOut">50</output>
    <input type="range" id="volBeat" min="0" max="100" step="1"></label>
</div>
<div id="pausemenu" hidden>
  <button id="resume">▶ 再開</button>
  <button id="tomenu" class="sub">≡ メニューへ戻る</button>
</div>
<div id="ui">
  <button id="start">▶ スタート</button>
  <button id="auto" class="sub">観賞モード</button>
    <button id="hold" class="sub">⏸ 一時停止</button>

  <span id="diffwrap"><label for="diff">難易度</label>
    <select id="diff">
      <option value="easy">やさしい</option>
      <option value="normal" selected>ふつう</option>
      <option value="hard">むずかしい</option>
    </select></span>
  <label><input type="checkbox" id="guide"> 左右の目印を出す（練習用）</label>
</div>
<div id="meta"></div>
<div id="build"></div>
<script type="module" src="./src/mock.js"></script>
</body>
</html>
