name: Deploy app to GitHub Pages

on:
  push:
    branches: [claude/magical-miku-contest-proposal-r37lcw]
    paths:
      - "miku-twintail/app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miku-twintail/app/package-lock.json
      - run: npm ci
        working-directory: miku-twintail/app
      - run: npm run build
        working-directory: miku-twintail/app
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miku-twintail/app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
