name: Deploy GitHub Pages

# GITHUB_TOKEN では Pages サイトの新規作成ができないため、
# 自動有効化が働く gh-pages ブランチへの配置方式を採用している。
on:
  push:
    branches:
      - main
      - claude/magical-miku-typing-game-na507c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect static files
        run: |
          mkdir -p _site
          rsync -a --exclude 'node_modules' --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
