name: Deploy app to GitHub Pages

# このリポジトリの Pages は gh-pages ブランチ配信（typing-game 案のワークフローが確立した方式）。
# GITHUB_TOKEN では Pages サイトの新規作成ができないため actions/deploy-pages は使わない。
# 他企画のディレクトリを保持するため destination_dir でサブディレクトリに配置する。
on:
  push:
    branches: [main, claude/magical-miku-contest-proposal-r37lcw, claude/miku-rhythm-redesign-r37lcw]
    paths:
      - "miku-twintail/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miku-twintail/app/package-lock.json
      - run: npm ci
        working-directory: miku-twintail/app
      - run: npm run build
        working-directory: miku-twintail/app
      - name: Collect static files
        run: |
          mkdir -p _site/prototype
          # dist には実曲版 index.html と擬似曲版 mock.html の両方が入る
          cp -r miku-twintail/app/dist/* _site/
          cp miku-twintail/prototype/index.html _site/prototype/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: miku-twintail
