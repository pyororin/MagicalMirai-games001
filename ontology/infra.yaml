# GitHub Pages / Actions / Claude Code リモート環境（sandbox）の知見
# スキーマは ontology/README.md を参照
domain: infra

concepts:
  - id: pages-deploy-method
    what: >
      このリポジトリの GitHub Pages は gh-pages ブランチ配信。
      各企画ブランチの Actions ワークフローが peaceiris/actions-gh-pages で
      gh-pages に push する。公開 URL は
      https://pyororin.github.io/MagicalMirai-games001/<企画ディレクトリ>/

  - id: vite-pages-base
    what: >
      Vite アプリを Pages のサブパスで配信するには vite.config.js に
      base: "./"（相対パス）を設定する。設定しないとアセットが 404 になる。

pitfalls:
  - id: pages-enablement-permission
    symptom: >
      actions/configure-pages の enablement: true が
      "Resource not accessible by integration" で失敗し、
      actions/deploy-pages 方式のワークフローが red になる。
    cause: GITHUB_TOKEN では Pages サイトの新規作成ができない。
    solution: >
      gh-pages ブランチ方式に切り替える（初回の gh-pages push で Pages が自動有効化される）。
      peaceiris/actions-gh-pages@v4 + github_token を使う。
    verified: 2026-08-30 (typing-game が発見、miku-twintail が追認)

  - id: gh-pages-mutual-wipe
    symptom: >
      デプロイ済みの Pages ページが突然 404 になる。gh-pages ブランチから
      自分の企画ディレクトリが消えている。
    cause: >
      複数の企画ブランチが同じ gh-pages に「サイト全体を置き換える」方式で
      デプロイすると、後から走った方が他企画のディレクトリを削除する。
      keep_files なしのルート publish は全置換になる。
    solution: >
      各企画のワークフローは publish_dir をビルド成果物に限定し、
      peaceiris の destination_dir: <企画ディレクトリ> で配置する
      （destination_dir 配下だけがクリーンされ、他企画は保持される）。
      全企画がこの方式に揃うまでは、消されたら workflow_dispatch で再デプロイして復旧。
      根本解決は main への集約と単一ワークフロー化。
    detection: gh-pages ブランチのルート一覧に自分のディレクトリがあるか確認する。
    verified: 2026-08-30 (miku-twintail、複数回発生)

  - id: sandbox-egress-allowlist
    symptom: >
      Claude Code リモート環境（sandbox）から外部 API に接続できない
      （connect_rejected / EGRESS_BLOCKED）。curl は 200 なのにブラウザだけ失敗することもある。
    cause: >
      sandbox の外部通信はドメイン許可制。ユーザーが環境設定で 1 ドメインずつ許可する必要がある。
      TextAlive 開発に必要なのは api.textalive.jp / api.songle.jp / songle.jp の 3 つ
      （詳細は textalive.yaml の required-domains）。
    solution: 必要ドメインをユーザーに依頼して許可してもらう。ワイルドカードは別サブドメインをカバーしない前提で個別に。
    verified: 2026-08-30 (miku-twintail)

  - id: sandbox-headless-chromium-tls
    symptom: >
      sandbox 内のヘッドレス Chromium だけ TLS 接続が ERR_CONNECTION_RESET になる
      （curl・Node fetch は同じホストに成功する）。プロキシ CA を NSS に取り込んでも直らない。
    cause: egress プロキシの中継が Chromium の TLS ハンドシェイクと相性が悪い（詳細不明のまま回避）。
    solution: >
      Playwright の page.route で全外部リクエストを横取りし、Node の fetch
      （NODE_USE_ENV_PROXY=1 + NODE_EXTRA_CA_CERTS=/root/.ccr/ca-bundle.crt）で
      中継して route.fulfill で返す。リダイレクトは redirect:"follow" で解決してから返す。
      実装例: このセッションの smoke テスト（Playwright route 中継パターン）。
    verified: 2026-08-30 (miku-twintail、実 API の E2E テストに成功)

  - id: pages-stale-cache
    symptom: 再デプロイ後もブラウザに古い JS が残り、修正が反映されて見えない。
    cause: Pages の静的アセットがブラウザキャッシュされる。
    solution: 強制再読み込み（Ctrl+F5 / Cmd+Shift+R）を案内する。Vite はハッシュ付きファイル名なので index.html さえ更新されれば解決する。
    verified: 2026-08-30 (miku-twintail)

  - id: pages-not-auto-enabled
    symptom: >
      gh-pages ブランチを push しても Pages が公開されない
      （pages-build-deployment ワークフローが走らない）。
    cause: >
      かつての「gh-pages を push すれば自動有効化」は現在は起きない。
      GITHUB_TOKEN でも Pages サイトの新規作成はできない（pages-enablement-permission 参照）。
    solution: >
      リポジトリの Settings → Pages → Source: Deploy from a branch → gh-pages / (root)
      を人間が 1 回だけ設定する。以後は push で自動反映される。
      配信ルートに .nojekyll を置いて Jekyll 処理を無効化しておく。
    verified: 2026-08-30 (typing-game)

  - id: stale-cache-misdiagnosis
    symptom: >
      修正をデプロイしたのに直らない。別のブラウザ/セッションでは新版が動くため
      「環境依存のバグ」に見えて調査が迷走する。
    cause: Pages の CDN キャッシュ（最大 10 分程度）とブラウザキャッシュ。
    solution: >
      ページにビルド番号を表示し（エラー画面にも出す）、どの版が動いているか
      一目で判別できるようにする。ユーザー案内はスーパーリロード /
      プライベートウィンドウ / ?v=N 付き URL。
      「直したのに直らない」の第一容疑者はキャッシュ。ビルド番号表示は最初から入れる。
    detection: ページ上のビルド番号が想定の値か確認する。
    verified: 2026-08-30 (typing-game、旧版キャッシュを新版と誤認して調査が長引いた)
    refs: [typing-game/prototype/textalive.html]

  - id: cdn-library-fragility
    symptom: 環境によってライブラリ自体が読めず、アプリが初期化されない。
    cause: >
      unpkg 等の CDN 直リンク（しかもバージョン未固定）は、コンテンツブロッカー・
      モバイル回線・CDN 障害・バージョン変動の影響を受ける。
    solution: >
      検証済みバージョンを vendor/ に同梱して同一オリジンから配信する
      （ビルドを使うなら npm でバンドルする）。
      TextAlive の UMD 版は axios のグローバルを前提とするので axios も同梱する。
    verified: 2026-08-30 (typing-game)
    refs: [typing-game/prototype/vendor/]


  - id: raf-stops-on-hidden-tab
    symptom: >
      裏タブにしている間、曲は鳴り続けるのにゲームの進行だけ止まる。
      戻ってくると打ち残しが一斉に MISS になる（音ゲー・リズムゲームで顕著）。
    cause: >
      requestAnimationFrame はドキュメントが hidden の間は呼ばれない。
      一方、audio の再生と TextAlive の timer.position は進み続けるため、
      「描画・判定ループ」と「曲の時刻」が乖離する。
    solution: >
      visibilitychange で hidden になったら曲ごと一時停止し、復帰時に
      明示操作で再開させる（時刻ベースの判定は rAF の欠落を吸収できない）。
      自動テストでヘッドレスに近い環境を使う場合も rAF は動かないので、
      検証時は requestAnimationFrame を setTimeout へ差し替えて回す。
    detection: 非表示タブで audio.currentTime だけが進み、進行バーが止まる。
    verified: 2026-08-30 (typing-game build 8)
    refs: [typing-game/prototype/textalive.html]

  - id: registered-property-transition-freezes-updates
    symptom: >
      @property で登録したカスタムプロパティ（例 --hue）を :root に定義し、
      同じ :root に transition を付けると、その後 --hue を更新しても
      computed value が初期値のまま変わらない（CSS ルールでも
      element.style.setProperty でも反映されない）。
    cause: >
      :root に対する registered custom property の transition が値の更新を
      塞いでしまう（Chrome 2026 で確認）。子要素に同じ変数を inline で
      設定すると正しく反映されるため、変数自体の仕組みではなく
      :root + transition の組み合わせが原因と切り分けられる。
    solution: >
      :root の transition を外し、補間が要るなら JS 側で毎フレーム
      少しずつ setProperty する（描画ループがあるゲームなら自然に書ける）。
    detection: >
      getComputedStyle(document.documentElement).getPropertyValue('--x') が
      更新後も初期値のまま。子要素に inline 指定して比較すると切り分けられる。
    verified: 2026-08-31 (typing-game build 11)
    refs: [typing-game/prototype/textalive.html]

  - id: raf-loop-dies-on-early-return
    symptom: >
      待機中のアニメーション（アトラクト画面など）が、環境によって最初の1フレームで
      止まったまま二度と動かない。エラーは出ない。
    cause: >
      ループ関数の先頭で「まだ描けない条件」を早期 return したとき、
      次フレームの requestAnimationFrame を積み直していないと、そこでループが
      静かに終わる。レイアウト確定前（幅・高さが 0）や、非表示タブで
      ネイティブ rAF が凍っている間に開始した場合に踏みやすい。
    solution: >
      早期 return する場合も必ず次フレームを積む（描かずに再スケジュールする）。
      「開始済みフラグ」を見て多重起動を防いでいるなら、そのフラグが立ったまま
      ループだけ死ぬ状態になり得ることに注意する。
    detection: >
      キャンバスが完全に透明のまま。clearRect/fillRect をラップして呼び出し回数を
      数えると、ループが回っていないことを一発で切り分けられる。
    verified: 2026-08-31 (typing-game build 12)
    refs: [typing-game/prototype/textalive.html]

  - id: webaudio-se-silent-on-mobile
    symptom: >
      楽曲(HTMLMediaElement / iframe プレイヤー)は鳴っているのに、
      Web Audio で合成した効果音だけが実機のスマホで鳴らない。
      PC ブラウザやヘッドレス検証では鳴るため再現しにくい。
    cause: >
      3つの原因が重なりうる。
      (1) AudioContext を作っただけでユーザー操作の中で resume() しておらず
          suspended のまま(自動再生ポリシー)。
      (2) iOS のマナースイッチ。<audio> 由来の音は鳴るが Web Audio だけ消音される。
      (3) suspended の間は currentTime が進まないため、その時点の currentTime を
          基準に予約した音は、resume 後には「過去の予約」になって鳴らない。
    solution: >
      ・document に capture で touchstart/pointerdown/mousedown/keydown を張り、
        最初の操作で必ず resume() + 無音バッファ(1サンプル)再生を通す。
      ・navigator.audioSession があれば type="playback" にする(iOS 16.4+)。
      ・音の予約は currentTime + 数ms 先に置く。
      ・出力は master GainNode 経由にまとめ、状態を画面に出す。
    detection: >
      画面のビルド番号の隣に actx.state を出す(snd:running / suspended / none)。
      ユーザーからの「鳴らない」報告を、コード経路の問題か出力の問題かで切り分けられる。
    verified: 2026-08-31 (typing-game build 21)
    refs: [typing-game/prototype/textalive.html]

  - id: pages-unreachable-from-sandbox
    symptom: >
      デプロイ後の反映確認のために sandbox から公開 URL(*.github.io)を curl すると
      `CONNECT tunnel failed, response 403` になり、いつまでも成功しない。
      「まだ反映されていない」と誤解して延々ポーリングしてしまう。
    cause: >
      エージェントの外向きプロキシが github.io への CONNECT を許可していない。
      Pages の配信状況とは無関係で、待っても解消しない。
    solution: >
      反映確認は GitHub Actions のワークフロー実行(list_workflow_runs)の
      conclusion=success で行う。ページの中身の確認はローカルファイルを
      ヘッドレスブラウザで開いて行い、公開 URL は利用者に提示するだけにする。
    detection: >
      curl の終了コード 56 と "CONNECT tunnel failed, response 403"。
      $HTTPS_PROXY/__agentproxy/status でも許可状況を確認できる。
    verified: 2026-08-31 (typing-game build 24)
    refs: [.github/workflows/pages-typing-game.yml]
