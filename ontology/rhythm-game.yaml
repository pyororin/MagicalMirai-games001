# リズムゲームの判定・入力・体感の知見（打鍵ミライ build 19〜40 で確立）
# 楽曲アプリ全般で効くもの。スキーマは ontology/README.md を参照
domain: rhythm-game-feel

concepts:
  - id: judge-window
    what: >
      判定窓（just/great/good/late）は「どこまで許容するか」だけの数値ではない。
      late は同時に「取りこぼしを MISS と確定するまでの待ち時間」でもあるため、
      広げるほどプレイは易しくなるが、失敗のフィードバックは遅れる。
      窓を決めるときは必ず「その時間だけ失敗音が遅れてよいか」を併せて考える。

  - id: input-commit-on-release
    what: >
      フリック（タップ＋スライド）方式では、文字が確定するのは指を離した瞬間。
      押下は入力の途中でしかないので、押下で音を鳴らしたり判定したりしない。
      逆に「押している間は待機できる」ことが操作の前提になる。
    depends_on: [judge-window]

  - id: note-queue
    what: >
      ノーツを 1 本の時間軸の配列で持ち、先頭（state.idx）だけを判定対象にする実装は、
      「先頭がまだ確定していない間、次のノーツを打てない」という副作用を持つ。
      取りこぼしの確定を待つ時間だけ、次の入力が古いノーツに吸われる。
    depends_on: [judge-window]

  - id: feedback-latency-budget
    what: >
      体感の遅れは「入力イベント→判定→音の生成→出力」の総和。
      このうちアプリが詰められるのは判定と生成だけで、出力（端末の
      オーディオ経路）は詰められない。切り分けるには実測値を画面に出す
      （AudioContext.outputLatency / baseLatency）。
    depends_on: [judge-window]

  - id: speed-multiplier
    what: >
      「先読み時間」と「ノーツの速さ」は同じものの裏表。画面上の間隔 =
      速度 × 時間差 なので、速度倍率を上げる＝先読みを短くする＝ノーツの間隔が
      広がる。ユーザーに見せるパラメータは 1 本（速度倍率）にしたほうが伝わる。

  - id: radial-vs-lane
    what: >
      落下レーン式は目線が横に走る代わりに助走距離を稼げる。
      四方から中心へ集める放射式は目線が 1 点に固定できるが、縦長の画面では
      軸ごとの距離が最大 2 倍以上違う。速度を揃えるか助走を揃えるかの
      どちらかしか選べない（両立しない）。打鍵ミライは助走を揃える側を選び、
      左右の短さは「奥行き（遠いうちは小さく・ゆっくり）」で吸収した。
      最終的にレーン式は捨て、放射式一本にした（layout-fork-doubles-the-work）。
    depends_on: [speed-multiplier]

pitfalls:
  - id: miss-declared-too-late
    symptom: >
      成功音は違和感がないのに、失敗（取りこぼし）の音だけリズムから
      明らかに遅れて鳴る。半拍〜1拍ずれて聞こえる。
    cause: >
      取りこぼしを MISS と確定するのが late 窓の満了時だから。late=600ms なら
      失敗音は必ず 600ms 遅れる。さらに「指を置いている間は刈り取らない」
      猶予を足していると、その分も上乗せされる。
    solution: >
      late 窓を、フィードバックがリズムに乗る範囲まで詰める（打鍵ミライでは
      600 → 300ms）。猶予も短くする。判定の甘さが欲しいなら late ではなく
      good 窓を広げる（good は「打てた」ので即座に音が返る）。
    detection: >
      ノーツ時刻と MISS 音の発火時刻の差を実測する（ヘッドレスで
      AudioBufferSourceNode.start をフックし、曲時刻と突き合わせる）。
    verified: 2026-08-31 (typing-game build 27)
    refs: [typing-game/prototype/textalive.html]

  - id: stale-note-eats-next-input
    symptom: >
      少し遅れた直後、次のノーツを正しい方向で打っているのに「方向違い」に
      なり、指が反応していないように感じる。
    cause: >
      取りこぼしが確定するまで列の先頭に残り、入力がそちらに向かうため
      （note-queue の副作用）。窓を詰めても、詰めた時間だけは必ず起きる。
    solution: >
      入力時に先頭が good 窓を過ぎていたら、直後（±late）に方向の合うノーツが
      あるか探し、間に挟まったものをその場で取りこぼしとして流してから判定する。
      まだ取れる位置のノーツを違う方向で打った場合は、先読みで次を拾わない
      （でないと適当な方向を連打するだけで当たってしまう）。
    detection: >
      ノーツ列を差し替えて「打ち逃し直後に次のノーツを打つ」状況を作り、
      idx と counts の遷移を見る。
    verified: 2026-08-31 (typing-game build 31)
    refs: [typing-game/prototype/textalive.html]

  - id: layered-sfx-feels-late
    symptom: >
      1 打あたりの音が「遅れて鳴る」「にじむ」と感じる。実際の発火は入力から
      数 ms なのに体感が合わない。
    cause: >
      1 回の入力で方向音・倍音・判定音を時間差で重ねていたため、音の塊が
      200ms 以上尾を引き、立ち上がりが埋もれていた。
    solution: >
      1 打 = 1 発にまとめ、60ms 程度で切る。方向は音階、判定は同時に重ねる
      倍音で表す（時間差で足さない）。
    detection: >
      AudioBufferSourceNode.start をフックし、1 打で鳴る音の数と長さを数える。
    verified: 2026-08-31 (typing-game build 27)
    refs: [typing-game/prototype/textalive.html]

  - id: oscillator-per-hit-latency
    symptom: >
      打鍵のたびに音が数十 ms 遅れて聞こえる。端末によって差が大きい。
    cause: >
      打つたびに OscillatorNode + GainNode を組み、setValueAtTime /
      exponentialRampToValueAtTime で包絡線を予約していた。組み立てと予約の
      ぶんだけ遅れる。初回は波形生成でさらに詰まる。
    solution: >
      波形を AudioBuffer に焼いて使い回し、AudioBufferSourceNode.start() を
      予約時刻なしで呼ぶ。使う音は最初のユーザー操作でまとめて焼いておく
      （プリウォーム）。AudioContext は latencyHint:0 で作る。
    detection: >
      createBuffer の呼び出し回数を数える（プレイ中に増えるならプリウォーム漏れ）。
    verified: 2026-08-31 (typing-game build 24〜25)
    refs: [typing-game/prototype/textalive.html, ontology/infra.yaml#webaudio-se-silent-on-mobile]

  - id: hold-should-not-auto-miss
    symptom: >
      「早めに指を置いて、タイミングで離す」打ち方をすると、置いている最中に
      勝手に MISS になる。
    cause: >
      取りこぼしの刈り取りが指の状態を見ていない。フリックは離した瞬間が
      確定なのに、押している間も時間だけが過ぎていく。
    solution: >
      画面に触れている指の数を持ち、触れている間は late 窓に猶予を足す。
      ただし置きっぱなしで曲が進むと、離した瞬間に溜まった MISS が一度に出るので
      猶予は 0.3〜0.4 秒程度に留める。判定自体は従来どおり離した時刻で行う。
    verified: 2026-08-31 (typing-game build 26)
    refs: [typing-game/prototype/textalive.html]

  - id: press-with-no-feedback-feels-broken
    symptom: >
      タップした瞬間に何も起きないため「反応していない」と感じる。
    cause: >
      確定が離した瞬間なので、設計上は正しく無音。だが押下で何も返さないと
      入力が届いたかどうか分からない。
    solution: >
      音は鳴らさず（確定ではないので）、押した位置に方向ガイドを出す・
      次に打つ方向を光らせるなど、視覚だけで受理を返す。
      押下に音を付けるとフリックキーボード風になるが、音数が倍になり
      リズムがにじむのでリズムゲームでは避ける。
    verified: 2026-08-31 (typing-game build 25〜26 で入れて外した)
    refs: [typing-game/prototype/textalive.html]

  - id: radial-portrait-tradeoff
    symptom: >
      四方から中心へ集めるレイアウトで、左右のノーツだけ「遅い」「唐突に出る」
      と感じる。
    cause: >
      縦長の画面では中心から上下端までの距離が左右端までの 2 倍以上ある。
      距離を活かすと軸ごとに速度が変わり、速度を揃えると軸ごとに助走時間が変わる。
    solution: >
      どちらを優先するか先に決める。打鍵ミライは最終的に
      「助走距離を最短軸に合わせて全軸で速度も時間も揃える」を選び、
      縦に余った上下を照明・客席として画に使った。
      速度優先で助走が短くなる軸には、画面外から入ってくる予告表示が要る。
    verified: 2026-08-31 (typing-game build 33〜35)
    refs: [typing-game/docs/DESIGN.md]

  - id: same-hue-icon-on-colored-note
    symptom: >
      ノーツの方向記号が読めない。色は付いているのに形が判別できない。
    cause: >
      方向色のノーツの上に、同系色（col.lit）で記号を描いていたため明度差が
      ほとんど無かった。色相だけで区別させると、明るい環境やドット絵では潰れる。
    solution: >
      暗い台座を敷いて白抜きで描く。どの方向色でもコントラストが一定になる。
      文字（かな）と記号は領域を分けて置く（台座が文字に掛かると今度は文字が読めない）。
    verified: 2026-08-31 (typing-game build 23〜24)
    refs: [typing-game/prototype/textalive.html]

  - id: judge-text-collides-with-finger-feedback
    symptom: >
      大きくした判定表示（JUST/MISS）が、指のそばに出るフィードバックと重なって
      結局読めない。
    cause: >
      どちらも「判定ラインの近く」に置いたため。指は判定ラインの周辺にある。
    solution: >
      判定表示は指が来ない場所（落下領域の中央、リングの上など）へ逃がす。
      レイアウトを変えたら、指の当たる領域と表示物の位置関係を必ず引き直す。
    verified: 2026-08-31 (typing-game build 23)
    refs: [typing-game/prototype/textalive.html]

  - id: beat-bounce-too-busy
    symptom: >
      キャラクターが拍ごとに跳ねて落ち着かない。曲によってはうるさい。
    cause: >
      拍（beat）ごとに等しく跳ねていた。4 拍子でも 3 拍子でも毎拍動く。
    solution: >
      小節の頭（beat.position === 1）だけ跳ねる。拍子に関係なく
      「3 拍子なら 3 回に 1 回」になる。振幅も控えめにする。
    verified: 2026-09-01 (typing-game build 40)
    refs: [typing-game/prototype/miku/README.md]

  - id: effect-state-not-reset-on-restart
    symptom: >
      中断して開始し直しても、前回のプレイの演出（客席のペンライトなど）が
      残っている。
    cause: >
      演出用の配列をモジュール変数で持ち、プレイ状態（state）の外に置いたため、
      state を作り直しても初期化されない。
    solution: >
      「プレイの寿命と同じもの」は state に入れるか、開始時に必ず通る
      リセット関数にまとめる（開始・チュートリアル開始・中断の全経路から呼ぶ）。
    detection: >
      演出配列の長さを返すデバッグフックを出し、中断→再開始で 0 に戻るか見る。
    verified: 2026-09-01 (typing-game build 40)
    refs: [typing-game/prototype/textalive.html]

  - id: character-motion-hard-to-extend
    symptom: >
      キャラクターの表情・ポーズ・仕草を足すたびに、描画関数と状態変数と
      ループの条件分岐を同時に触ることになり、追加も削除もしづらい。
    cause: >
      スプライトの描画・状態遷移・アプリ側の都合（判定への反応、口パク、拍の跳ね）が
      1 つの関数群に混ざっていた。
    solution: >
      「見た目と仕草」を別ファイルのコンポーネントに切り出し、表情・ポーズ・仕草を
      それぞれ 1 つのテーブルに 1 行足すだけで増える形にする。アプリからは
      キャンバスと「いま歌っているか」だけを渡す。追加手順を同じディレクトリの
      README に書き、更新時は README も同じコミットで直す運用にする。
    verified: 2026-09-01 (typing-game build 40)
    refs: [typing-game/prototype/miku/README.md, typing-game/prototype/miku/miku.js]

  - id: playfield-under-thumb
    symptom: >
      スマホを片手で持ってプレイすると、盤面の下側（判定リングの下辺や
      下方向ノーツの湧き口）が指と手のひらで隠れて見えない。右手・左手を
      入れ替えても隠れる。
    cause: >
      盤面を画面の上下中央に置いた。縦長端末では下端の両隅から半径 250px 前後が
      親指の可動域で、画面の下 3 割前後は「触る場所」であって
      「見る場所」ではない。左右反転で直るのは横方向の偏りだけで、
      下側の遮蔽は左右どちらでも起きる。
    solution: >
      盤面の中心を画面高の 40% 前後まで上げ、下 35〜40% は演出（客席など）だけの
      領域にして情報を置かない。掲示板を複数枚に分けると筐体の枠だけで数十 px を
      食って盤面が下がるので、1 枚にまとめて上部に集約する。
    detection: >
      実機サイズでスクリーンショットを撮り、下端の左右隅から半径 250px の円を
      重ねて、リング下辺とノーツの湧き口がその外側にあるか確認する。
    verified: 2026-09-05 (typing-game build 41)
    refs: [typing-game/prototype/textalive.html]

  - id: layout-fork-doubles-the-work
    symptom: >
      同じ判定コアで「2 つの配置（レーン式／放射式）」を切り替え式に持っていたら、
      片方を作り込むたびにもう片方が壊れる。画面構成・キャラの立ち位置・判定文字の
      位置・演出の飛び先が、そのつど両方に分岐する。
    cause: >
      差し替えたかったのは「ノーツがどこに湧いてどう動くか」だけなのに、
      実際には描画のほぼ全部（座標系・レイアウト・演出の行き先）が
      配置に依存していた。共通化できたのは判定コアだけだった。
    solution: >
      早い段階でどちらか 1 つに決め、捨てるほうは「残して切り替え可能にする」のではなく
      本当に消す。消すときは分岐だけでなく、その配置のためだけにあった
      補助関数・座標ヘルパ・データ項目（ノーツの lane 番号など）まで併せて落とす。
      分岐の削除だけだと、使われない変数（例: 判定ラインの pump 配列）が残って
      実行時エラーになる。
    detection: >
      「配置を判定する関数（isReflect など）」の呼び出し箇所を数える。
      判定コア以外に散らばっているなら、それは切り替え式のコストが
      共通化の利益を上回っているサイン。
    verified: 2026-09-05 (typing-game build 43)
    refs: [typing-game/prototype/textalive.html, typing-game/docs/DESIGN.md]

  - id: perspective-shrink-fights-legibility
    symptom: >
      ノーツに文字を載せているのに読めず、タイミングだけを見て打つ（目押し）
      プレイになる。近くに来れば読めるが、そのときにはもう間に合わない。
    cause: >
      奥行き感のために「遠いノーツほど小さく」していた。読む必要があるのは
      湧いた直後（いちばん遠い）なのに、そこがいちばん小さいという逆転。
      さらにタイル内で方向記号が場所を食い、文字の占有率が半分以下だった。
    solution: >
      遠方の縮小率は 0.8 倍程度で止める（0.6 台まで縮めない。奥行きは 0.8〜1.0 の
      差でも十分出る）。方向が色や配置でも分かるなら、タイル内の記号は小さくして
      文字にスペースを回す。重なり順は「奥から描いて手前を最後」にし、
      いま打つ 1 個が必ず一番上に来るようにする。
    detection: >
      湧いた瞬間のスクリーンショットを実機解像度で撮り、文字が読めるか見る。
      判定点での見た目だけで判断しない。
    verified: 2026-09-06 (typing-game build 44)
    refs: [typing-game/prototype/textalive.html]

  - id: gap-only-thinning-kills-anticipation
    symptom: >
      難易度を下げても「簡単になった」感じがせず、むしろ歌詞との対応が切れて
      目押し一辺倒になる。歌詞を読んでも次の操作が想像できない。
    cause: >
      間引きが「前から順に、最小間隔を満たすものを拾う」だけだと、残る音が
      拍とも歌詞の文字頭とも無関係な位置に来る。密度は下がるが予測可能性は
      むしろ下がる。
    solution: >
      残す価値を点数化して選ぶ。フレーズの1音目 > 拍の上 > 8分の裏 >
      文字の1音目 > その他、の順に取り、そのうえで難易度ごとの最小間隔を守る。
      難易度は「密度」ではなく「拾う拍の細かさ」で表現する
      （EASY=拍の上だけ / NORMAL=8分まで / HARD=全部）。
    detection: >
      一定BPMの疑似譜面で selectIdx を単体実行し、EASY の結果が拍の格子に
      きれいに乗るか、フレーズ頭が必ず残るかを確認する。
    verified: 2026-09-06 (typing-game build 44)
    refs: [typing-game/prototype/textalive.html]

  - id: lyric-color-must-match-the-chart
    symptom: >
      歌詞に操作方向を色で示しているのに、実際に打つ場所と食い違い、
      かえって読み違える。
    cause: >
      歌詞は「全部のかな」を方向色で塗っていたのに、譜面は難易度で間引かれていた。
      表示は原文ベース、譜面は選抜後ベース、という別のデータを見ていた。
    solution: >
      表示側も譜面（選抜後のノーツ列）を参照し、実際にノーツになるかなだけ
      色を付ける。間引かれたかなは無彩色で薄く流す。
      文字→かな→ノーツの対応は charIdx とかなの一致で貼り直す。
    detection: >
      一部のノーツだけを残した状態を作り、その文字だけ色が付くか目視する。
    verified: 2026-09-06 (typing-game build 44)
    refs: [typing-game/prototype/textalive.html]

  - id: beat-visible-only-on-the-character
    symptom: >
      曲のビートを感じ取る手掛かりがキャラクターの動きだけで、ノーツを見ている間は
      テンポが取れない。
    cause: >
      拍の表現をキャラクター 1 箇所に集約していた。プレイ中の視線は判定点に
      固定されるので、そこから離れた場所の動きは見えない。
    solution: >
      判定点の近くで、かつノーツが通らない空き地に拍を出す。放射式なら
      上下左右がノーツの通り道なので、斜め45°が空く。そこにレベルメーターや
      拍のたびに広がる波を置く。ノーツと取り違えないよう、
      (1) 動きの向きを逆にする（ノーツ=外から内 / 拍=内から外）、
      (2) 方向色を使わず無彩色にする、の2点で区別する。
    detection: >
      拍だけを動かしたスクリーンショットを撮り、ノーツと見分けが付くか確認する。
    verified: 2026-09-06 (typing-game build 44)
    refs: [typing-game/prototype/textalive.html]

  - id: two-requirements-per-note
    symptom: >
      1ノーツに「タイミング」「音の高さ」「顔(ピンチ)」のように複数の条件を課すと、
      どれか1つ外しただけで全部失敗に見え、難しすぎて楽しくない。
    cause: >
      両手が別々の操作で、片方の準備(ピンチを作り直す)に時間がかかる。条件を同時に厳密に
      要求すると、人間の動作の前後ずれが全部失敗になる。
    solution: >
      条件ごとに許容を変える。(1)段(音の高さ)違いは当たり扱いにせず取り直せる(消費しない)、
      (2)顔違いは当てた上で点だけ半分にして、打鍵の前160ms〜後150msにそろえば良しとする猶予を持つ
      (確定を猶予の分だけ保留する)、(3)窓の外のタップは自由演奏として減点しない。
      さらに、操作の持ち替えに時間がかかる分だけ、難易度の最小間隔を「操作が変わるとき/変わらないとき」で分ける。
    detection: >
      譜面どおりに弾くボット(合成 PointerEvent)を作り、全 PERFECT / 顔違いのみ / 段違いのみ / 放置 の
      4通りで counts を見る。ボット自身の状態管理の誤り(フラグを立て忘れて離さない等)で
      「顔違いが多発」と誤診しやすいので、まずボットの入力履歴を疑う。
    verified: 2026-11-14 (bunyutto-miku)
    refs: [bunyutto-miku/app/src/judge.js, bunyutto-miku/test/judge.test.mjs]

  - id: pixel-character-cute-first
    symptom: >
      ドット絵のキャラクターを「精巧に」描いたら、見る人に「怖い」と言われた。
    cause: >
      写実寄りに寄せる要素(鋭く濃いまつ毛、ぎざぎざの前髪、歯を並べた口、頬の線、
      怒り方向の眉、濃い輪郭線)が、小さいドットでは表情の読み取りを硬くし不気味さになる。
      「ドットの細かさ」と「可愛さ」は別軸で、細かく描くほど怖くなることがある。
    solution: >
      モチーフ(デフォルメされた公式風のちびキャラ等)を参照し、丸い輪郭・大きく丸い目(ハイライト2つ)・小さな口・
      まるいスカラップの前髪・うすい肌色の輪郭線に寄せる。歯は描かない。眉は怒り方向にしない。
      表情の変形(頬を伸ばす等)も、尖らせず「おもち」のように丸く膨らませる。
      「可愛い」は絶対条件として、最初のレビュー観点に置く。
      ドットの粗さも別の指摘になりうる(80×80 を大きく表示すると1ドットが目立つ)。描画コードは論理座標
      (80×80)で書いたまま、実画素を4倍(320×320)にして塗り、表示は滑らかに縮小する。
      1px 幅の線は太さ指定の線分に、階段状に打っていた弧は折れ線に置き換える。
      高解像度は重いので、見た目が変わらないフレームは描き直さない(重みを粗く量子化したキーで判定)。
      描画 1 回はデスクトップ相当で約 4.6ms(5倍=400×400 は 7.5ms だったので 4 倍に決めた)。
    detection: >
      5表情を並べた確認ページ(face-lab.html)を作り、実際のサイズで見て、
      「初見で怖くないか」を最優先に確認する。
    verified: 2026-11-14 (bunyutto-miku。初版を作り直した)
    refs: [bunyutto-miku/app/src/face.js, bunyutto-miku/app/face-lab.html]

  - id: expression-pops-instead-of-morphing
    symptom: >
      ピンチを開く/閉じるときの顔の変化が「オン・オフ」に見える。指の動きに追従せず、
      ある量を超えた瞬間に目や口がパッと別の形に入れ替わる。
    cause: >
      顔の幅・眉などの数値は連続的に混ぜていたが、目と口は「型」(丸い目/にっこり弧/線、
      楕円の口/笑顔の口…)を最大の重みで切り替えていた。型の切り替わりが見た目の不連続になる。
      タッチ入力側(量→重み)を滑らかにしても、描画側が離散だと直らない。
    solution: >
      型を持たず、形そのものをパラメータで表して補間する。目は「ひらき(open)・反り(bow)・
      「＞＜」への変形量(chev)」で、まぶたの線と目玉の縦幅が連続して変わるようにし(ハイライトも
      ひらきに応じて少しずつ現れる)、口は「大きさ・上辺の平らさ・角の立ち・くちびるの太さ・舌」で
      楕円から笑顔・四角・すぼめ口まで1つの式で描く。効果記号(きらきら等)も重みで大きさを変える。
      まばたきも 0/1 ではなく、閉じて開く連続値にする。
      形どうしを補間するときは、端点の対応に注意する。弧(＾)とくの字(＞)を端点どうしで直接つなぐと、弧の端が
      目の中を横切って崩れる(右目は上下が逆になる)。「回転させながら寄せる」と途中の形も自然になる。
    detection: >
      量を 0〜100% の 12.5% 刻みで並べたコマ送り表(face-lab.html)を出し、隣のコマ同士で
      形が飛んでいないか見る。
    verified: 2026-11-14 (bunyutto-miku)
    refs: [bunyutto-miku/app/src/face.js, bunyutto-miku/app/face-lab.html]

  - id: synth-voice-verify-by-spectrum
    symptom: >
      Web Audio で母音(あいうえお)を合成したが、ヘッドレス環境では聴けず、
      母音の区別がついているか・音量がそろっているか分からない。
    cause: >
      最初の実装は基音ばかりが強く(392Hz で 90% 以上が 1kHz 未満)、フォルマントの山が出なかった。
      音を聴かずに「それっぽい」と判断すると外す。母音ごとの音量差も 3 倍近く出ていた。
    solution: >
      OfflineAudioContext に同じグラフを組んで(Voice.attach(ctx))1秒レンダリングし、
      FFT で帯域エネルギー・重心・RMS を母音×2つの高さで出す。倍音の減衰(1/n^1.15)、
      フォルマントの Q(5〜9)、母音ごとの高域の明るさ(い・えは明るく、う・おは暗く)を調整し、
      RMS をそろえて母音ごとの音量補正にする。聴感の最終確認は実機で行う。
    detection: 母音ごとの重心と RMS を並べる。い>え>あ>お>う の順で暗くなり、RMS は ±3dB 以内。
    verified: 2026-11-15 (bunyutto-miku)
    refs: [bunyutto-miku/app/src/voice.js]

  - id: gate-sound-on-all-inputs
    symptom: >
      2つの入力(タップ+ピンチ)を要求するゲームで、片方だけでも鳴る/判定されると、
      「押していないのに音が出る」「無音なのに当たる」ように感じる。
    cause: >
      発声と判定を、片方の入力イベント(タップ)に直結していた。
    solution: >
      「条件がそろっている状態」を1つの関数(updateSound)にして、入力が変わるたびに評価する。
      発声開始の瞬間を判定(attack)の瞬間にする。どちらを先に触っても、そろった時点で鳴り、
      片方を離せば止まる。ボットと CDP のマルチタッチで「タップだけ/ピンチだけ/両方」を確認する。
    verified: 2026-11-15 (bunyutto-miku)
    refs: [bunyutto-miku/app/src/game.js]

  - id: gh-pages-concurrent-push-race
    symptom: >
      デプロイのワークフローがテスト・ビルドまで通るのに、最後の push で
      `cannot lock ref 'refs/heads/gh-pages': is at X but expected Y` で失敗する。
    cause: >
      複数のワークフロー(企画ごと・ランディング)が同じ main への push で同時に起動し、
      concurrency グループがワークフローごとに別なので、同時に gh-pages へ push して競合した。
    solution: >
      失敗したジョブを1回再実行すれば通る(先に終わった側と衝突しただけ)。恒久策は全ワークフローで
      同じ concurrency グループ(例: gh-pages-deploy)にして直列化すること
      (待機は最新の1件しか残らないので、取りこぼしたら手動で再実行する)。
    detection: ログ末尾の `remote rejected ... cannot lock ref`。ビルド/テストの段は成功している。
    verified: 2026-11-15 (bunyutto-miku 初回デプロイ)
    refs: [.github/workflows/pages-bunyutto-miku.yml, .github/workflows/pages-typing-game.yml]

  - id: character-design-as-data
    symptom: >
      キャラクターの見た目(色・形・表情)をコードに埋め込むと、デザイン調整のたびにコードを触ることになり、
      調整のたびに別の部分が壊れる。デザインを提案・確認・差し替えする人(コードを書かない人)が関われない。
    cause: >
      デザインの値(色、顔の大きさ、眉の傾き、表情ごとの口の形、髪の曲線)が描画コードの中の数値リテラルになっていた。
    solution: >
      デザインをデータファイル(JSON)に切り出し、描画コードはそれを読んで描くだけにする。
      コードは検証(必須項目・色・数値、場所つきのエラー)を持ち、壊れたデータは起動時に止めて理由を画面に出す。
      ?design=URL で別案を試せるようにし、JSON を編集してその場でプレビューできるラボ(face-lab.html)と、
      項目の意味を書いた README を同じ場所に置く。リファクタは「全表情×まばたき等のピクセルのハッシュが前後で一致する」
      ことで見た目不変を保証する。デザインシート(PNG)も生成してリポジトリに残す。
    detection: >
      デザイン変更の PR で、コードの差分が出ていない(JSON とシートだけ)ことを確認する。
      単体テストで「データを変えると絵が変わる」「髪はピンチで動かない」を固定する。
    verified: 2026-11-15 (bunyutto-miku。16パターンのハッシュ一致を確認して移行)
    refs: [bunyutto-miku/app/data/design/miku-face.json, bunyutto-miku/design/README.md, bunyutto-miku/test/design.test.mjs]

