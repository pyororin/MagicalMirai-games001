  - id: dev-song
    what: >
      動作確認済みの開発用デフォルト曲。contest-songs-2025 の「ロンリーラン / 海風太陽」を使う
      （公式サンプル textalive-app-basic と同一で、実再生・歌詞取得まで確認済み）。
    depends_on: [contest-songs-2025]
    verified: 2026-08-30 (miku-twintail / typing-game 両企画)

pitfalls:
  - id: card-data-resolver-unavailable
    symptom: >
      画面が「読み込み中」のまま進まず、コンソールに
      "Card data resolver is unavailable" が出る。
    cause: >
      Player 初期化時の api.textalive.jp への接続が失敗したまま
      createFromSongUrl が呼ばれた（ライブラリ内の card マネージャ未初期化）。
      ネットワーク到達性（ドメイン未許可・ブロッカー）が典型原因。コードのバグではないことが多い。
    solution: >
      required-domains の 3 ホストへの到達性を確認する。加えてライブラリ読み込みを
      unpkg 依存にしない（バージョン未固定でブロッカーの影響も受けやすい）。
      npm でバンドルするか、検証済みバージョンを vendor/ に同梱して同一オリジン配信する。
    detection: >
      createFromSongUrl に .catch を付け、window の error / unhandledrejection を拾い、
      15 秒のウォッチドッグで 3 ホストへ fetch 疎通チェックして画面に表示する
      （実装例: miku-twintail/app/src/main.js の「起動診断」）。
    verified: 2026-08-30 (miku-twintail / typing-game)

  - id: songle-jp-missing
    symptom: >
      曲名・アーティスト名（メタデータ）までは表示されるのに、再生しても
      position が進まない・音が鳴らない。songle.jp/songs/*/u への読み込み失敗。
    cause: >
      songle.jp（ベアドメイン）が未許可。api.songle.jp を許可しただけでは足りない。
      piapro 曲の音源そのものと歌詞パーサは songle.jp から配信される。
    solution: songle.jp を api.songle.jp とは別エントリとして許可する。
    verified: 2026-08-30 (miku-twintail)

  - id: silent-load-failure
    symptom: エラーが何も表示されず「読み込み中」で停止。原因調査に時間がかかる。
    cause: >
      createFromSongUrl の Promise 拒否や初期化中の例外が既定では画面に出ない。
    solution: >
      起動診断をテンプレとして最初から入れる（.catch + unhandledrejection + ウォッチドッグ疎通チェック）。
      新規アプリでは最初のコミットから入れておくこと。
    verified: 2026-08-30 (miku-twintail)

  - id: cards-resolve-redirect
    symptom: 独自プロキシ/中継層を挟むと cards/resolve の後で読み込みが止まる。
    cause: api.textalive.jp/cards/resolve は 302 リダイレクトを返す。中継層がリダイレクトを追従しないと途切れる。
    solution: 中継層ではリダイレクト追従（redirect: follow）で最終レスポンスを返す。
    verified: 2026-08-30 (miku-twintail, sandbox 中継テスト)

  - id: webaudio-user-gesture
    symptom: 効果音・自前生成音が鳴らない（エラーも出ないことがある）。
    cause: ブラウザの自動再生制限。AudioContext はユーザー操作（クリック/タップ）内で生成/resume が必要。
    solution: 最初の pointerdown / ボタン押下で AudioContext を生成し resume する。
    verified: 2026-08-30 (miku-twintail)
