        source: TextAliveJp/textalive-app-lyric-sheet
      - title: アリフレーション / 雨良 Amala
        url: https://piapro.jp/t/SuQO/20250127235813
        video: { beatId: 4694276, chordId: 2830731, repetitiveSegmentId: 2946479, lyricId: 67811, lyricDiffId: 20655 }
        source: TextAliveJp/textalive-app-p5js
      - title: インフォーマルダイブ / 99piano
        url: https://piapro.jp/t/Ppc9/20241224135843
        video: { beatId: 4694277, chordId: 2830732, repetitiveSegmentId: 2946480, lyricId: 67812, lyricDiffId: 20656 }
