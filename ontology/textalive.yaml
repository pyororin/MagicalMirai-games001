  - id: dev-song
    what: >
      動作確認済みの開発用デフォルト曲。contest-songs-2025 の「ロンリーラン / 海風太陽」を使う
      （公式サンプル textalive-app-basic と同一で、実再生・歌詞取得まで確認済み）。
    depends_on: [contest-songs-2025]
    verified: 2026-08-30 (miku-twintail / typing-game 両企画)

pitfalls:
  - id: card-data-resolver-unavailable
    symptom: >
      createFromSongUrl が "Card data resolver is unavailable" で失敗し、
      画面が「読み込み中」のまま進まない。ネットワークは正常に見えるのに起きる。
    cause: >
      api.textalive.jp/cards/resolve はカード URL への 302 を返すが、
      クライアント v0.5.2 は redirect:"manual" で叩くため status 0 となり、
      リゾルバ利用不可と判定してしまう（サーバーとクライアントの挙動不一致）。
      ネットワーク到達性の問題ではないので、ドメイン許可を足しても直らない。
      別要因として、required-domains のホストが本当に遮断されている場合も同じ症状になる。
    solution: >
      曲ごとにカード URL を事前解決しておき、createFromSongUrl が
      "Card data resolver" で失敗したら createFromCardUrl(カードURL) にフォールバックする。
      これならブラウザのリダイレクト追従も CORS プリフライトも不要になる。
      事前解決コマンド:
        curl -sS -o /dev/null -w "%{redirect_url}" \
          "https://api.textalive.jp/cards/resolve?url=<URLエンコードした曲URL>" \
          -H "x-ta-app-token: <トークン>"
      実装例: miku-twintail/app/src/main.js の loadSong、
      別解（実行時にリダイレクトを自前追従）: typing-game/prototype/textalive.html の createFromSong。
      カード URL は contest-songs-2025 に記録済み。
    detection: >
      createFromSongUrl に .catch を付け、window の error / unhandledrejection を拾い、
      15 秒のウォッチドッグで 3 ホストへ疎通チェックして画面に表示する
      （実装例: miku-twintail/app/src/main.js の「起動診断」）。
      さらに fetch/axios をラップして「失敗した通信の URL と HTTP ステータス」を
      画面に出すと原因が一意に絞れる（実装例: typing-game/prototype/textalive.html）。
      注意: redirect:"manual" の応答は正常でも status 0 に見えるため「HTTP 0」を即異常と判断しない。
    verified: 2026-08-30 (miku-twintail / typing-game)
    note: >
      同じ症状に原因が 2 系統ある。ネットワーク到達性（上記）と、
      クライアント/サーバーのリダイレクト不一致（cards-resolve-302-mismatch）。
      ドメインが全て到達可能なのに出るなら後者を疑う。

  - id: cors-probe-false-positive
    symptom: >
      到達性チェックで api.songle.jp / songle.jp が「接続失敗」と出るが、
      実際にはアプリは通信できている（誤診）。
    cause: >
      これらは script タグで読む前提のリソースで CORS ヘッダを返さないため、
      fetch(url, { mode: "cors" }) は到達できていても必ず失敗する。
    solution: >
      到達性だけを見たいときは mode:"no-cors" で叩く（成功すれば到達可能。
      内容は読めないが、遮断との区別はつく）。api.textalive.jp は CORS 対応なので cors のままでよい。
    verified: 2026-08-30 (miku-twintail)

  - id: relay-test-hides-redirect-bugs
    symptom: >
      サンドボックスのテストでは動くのに、ユーザーのブラウザでだけ楽曲読み込みが失敗する。
    cause: >
      sandbox-headless-chromium-tls の回避策（Playwright route + Node fetch 中継）で
      redirect:"follow" を使うと、ブラウザには 302 が届かず 200 に見える。
      リダイレクト絡みの不具合が中継に隠蔽されてしまう。
    solution: >
      リダイレクトを返すエンドポイント（/cards/resolve など）は中継でも
      redirect:"manual" にして 302 をそのままブラウザへ返し、本番条件を再現する。
    verified: 2026-08-30 (miku-twintail。この再現でフォールバックの動作を確認できた)

  - id: songle-jp-missing
    symptom: >
      曲名・アーティスト名（メタデータ）までは表示されるのに、再生しても
      position が進まない・音が鳴らない。songle.jp/songs/*/u への読み込み失敗。
    cause: >
      songle.jp（ベアドメイン）が未許可。api.songle.jp を許可しただけでは足りない。
      piapro 曲の音源そのものと歌詞パーサは songle.jp から配信される。
    solution: songle.jp を api.songle.jp とは別エントリとして許可する。
    verified: 2026-08-30 (miku-twintail)

  - id: silent-load-failure
    symptom: エラーが何も表示されず「読み込み中」で停止。原因調査に時間がかかる。
    cause: >
      createFromSongUrl の Promise 拒否や初期化中の例外が既定では画面に出ない。
    solution: >
      起動診断をテンプレとして最初から入れる（.catch + unhandledrejection + ウォッチドッグ疎通チェック）。
      新規アプリでは最初のコミットから入れておくこと。
    verified: 2026-08-30 (miku-twintail)

  - id: cards-resolve-redirect
    symptom: 独自プロキシ/中継層を挟むと cards/resolve の後で読み込みが止まる。
    cause: api.textalive.jp/cards/resolve は 302 リダイレクトを返す。中継層がリダイレクトを追従しないと途切れる。
    solution: >
      中継層ではリダイレクト追従（redirect follow）で最終レスポンスを返す。
    verified: 2026-08-30 (miku-twintail, sandbox 中継テスト)

  - id: webaudio-user-gesture
    symptom: 効果音・自前生成音が鳴らない（エラーも出ないことがある）。
    cause: ブラウザの自動再生制限。AudioContext はユーザー操作（クリック/タップ）内で生成/resume が必要。
    solution: 最初の pointerdown / ボタン押下で AudioContext を生成し resume する。
    verified: 2026-08-30 (miku-twintail)

  - id: cards-resolve-302-mismatch
    symptom: >
      ドメイン到達性・トークン・CORS がすべて正常なのに
      createFromSongUrl が即座に "Card data resolver is unavailable" で失敗する。
      診断すると /cards/resolve が「HTTP 0」と記録される。
    cause: >
      クライアント v0.5.2 は /cards/resolve に 200 JSON を期待するが、
      サーバーは 302 リダイレクトを返す（サーバー側の挙動にクライアント最新版が未追従）。
      ライブラリは fetch(..., {redirect:"manual"}) で呼ぶため 302 は status 0 になり、
      status!==200 → {status:"unavailable"} → 例外、という経路をたどる。
      ブラウザから直接叩く場合に顕在化する（中継層がリダイレクトを追従する構成では起きない）。
    solution: |
      失敗時に自前でリダイレクトを追従し、確定したカード URL を createFromCardUrl に渡す。
        player.createFromSongUrl(url, opts).catch(e => {
          if (!String(e).includes("Card data resolver")) throw e;
          return fetch("https://api.textalive.jp/cards/resolve?url=" + encodeURIComponent(url),
                       { redirect: "follow", headers: { "x-ta-app-token": APP_TOKEN } })
            .then(r => { if (!r.ok || !r.url) throw e; return player.createFromCardUrl(r.url, opts); });
        });
      重要: resolve のリダイレクト先はトークンヘッダの有無で変わる。
      ヘッダ有り → 相対 /cards/{id}（api ホストの JSON・CORS 有り・200）。
      ヘッダ無し → https://textalive.jp/cards/{id}（人間向けページ）。必ずトークンを付ける。

      別解（曲が固定なら、より確実）: カード URL を開発時に解決して定数に持ち、
      失敗時は createFromCardUrl(既知のカードURL) を呼ぶ。実行時のリダイレクト追従も
      CORS プリフライトも不要になる。課題曲 6 曲のカード URL は contest-songs-2025 に記録済み。
      事前解決コマンド:
        curl -sS -o /dev/null -w "%{redirect_url}" \
          "https://api.textalive.jp/cards/resolve?url=<URLエンコードした曲URL>" \
          -H "x-ta-app-token: <トークン>"
      実装例: miku-twintail/app/src/main.js の loadSong。
    detection: >
      curl -si -H "x-ta-app-token: $TOKEN" \
        "https://api.textalive.jp/cards/resolve?url=<encoded>" | head -5
      で 302 と location を確認する。
    verified: 2026-08-30 (typing-game、302 を再現した E2E で修正を確認)
    refs: [typing-game/prototype/textalive.html]

  - id: token-header-name
    symptom: 自前で API を叩くと {"error":"invalid TextAlive token"} が返る。
    cause: ヘッダ名の誤り。x-textalive-app-token ではなく x-ta-app-token が正しい。
    solution: |
      ヘッダは x-ta-app-token。トークン有効性は次で確認できる。
      curl -s -H "x-ta-app-token: $TOKEN" https://api.textalive.jp/ | jq .app
      app.data.name にアプリ名が返れば有効（app.error があれば無効）。
    verified: 2026-08-30 (typing-game)

  - id: invalid-token-degrades-silently
    symptom: トークンが無効でも例外が出ず、後段で無関係に見えるエラーになる。
    cause: >
      ライブラリはトークン検証に失敗すると console.warn
      （「トークンが正しく指定されていないため動作しません」）を出すだけで劣化続行する。
    solution: 初期化直後に console を確認する。上記 curl で事前検証する。
    verified: 2026-08-30 (typing-game、ライブラリ実装を確認)

  - id: no-reading-data-for-kanji
    symptom: 歌詞の文字を「かな」として扱いたいのに、漢字の読みが取れない。
    cause: >
      TextAlive の文字単位データ（char.text）は表示文字であり、読み（かな）は API から提供されない。
      実測（ロンリーラン）では表示 386 文字中かなは 284 文字（74%）。
    solution: >
      形態素解析でビルド時に事前生成し、JSON として同梱する（実行時に解析しない）。
      手順: カード JSON の lyrics.url（= piapro の歌詞ページ）から本文を取り、
      kuromoji で分かち書き＋読みを取得し、表層形と読みを 1 文字ずつ対応づけて
      「歌詞全文の 1 文字 = 1 読み」の配列にする。実行時は phrase の char.text を
      空白を無視した圧縮列に突き合わせてカーソルで引く（ロンリーランで 386/386 一致）。
      漢字 1 文字が複数モーラを持つ場合は char の startTime〜endTime を等分して
      かなごとのノート時刻にする。かなだけ扱う設計なら、カタカナは
      charCode - 0x60 でひらがなへ正規化する。
      これで打鍵対象は 284 かな（かなのみ）→ 450 かな（読み込み）へ増える。
    detection: 実データのかな比率と文字間隔は onVideoReady 後に video.firstPhrase を辿って集計できる。
    verified: 2026-08-30 (typing-game、課題曲 6 曲を生成。ロンリーランで実機照合)
    refs: [typing-game/prototype/tools/build-readings.mjs, typing-game/prototype/data/readings/]

  - id: lyric-text-is-not-in-card-json
    symptom: カード JSON（api.textalive.jp/cards/<id>）に歌詞の「文字」が入っていない。
    cause: >
      カード JSON の lyrics は phrases > words > characters の時刻だけを持ち、
      文字そのものは持たない。文字はクライアントが lyrics.parserUrl の
      パーサで lyrics.url（piapro 等の歌詞ページ）から取り出して合成している。
    solution: >
      サーバー側（Node）で歌詞本文が欲しいときは lyrics.url を直接取得する。
      piapro は <div class="contents_text_txt"><p>…</p> に <br /> 区切りで入っている。
      文字と時刻の対応が要るなら、ブラウザで Player を動かして
      video.firstPhrase を辿るのが確実。
    verified: 2026-08-30 (typing-game、読みデータ生成で利用)
    refs: [typing-game/prototype/tools/build-readings.mjs]

  - id: side-data-races-onvideoready
    symptom: >
      自前の付随データ（読みデータ等）を fetch しているのに、たまに
      「データ無し」の劣化動作になる。ローカルでは再現せず、Pages など
      ネットワークが遅い環境で起きる。
    cause: >
      onVideoReady は自前 fetch の完了を待たない。結果を変数に置いて
      「まだ null なら無視」という書き方だと、競合したときに黙って劣化する。
    solution: >
      変数ではなく Promise をモジュール内で共有し、onVideoReady 側で
      await する（取得開始はページ読み込み直後に前倒しする）。
      取得先は相対パスではなく new URL(path, document.baseURI) で組み立てる
      （Pages はサブディレクトリ配下に置かれるため）。ビルド番号を
      クエリに付けて古いキャッシュを避け、失敗したら URL と HTTP ステータスを
      画面に出す（黙って劣化させない）。
    verified: 2026-08-30 (typing-game build 8、data/readings を Pages 相当の入れ子パスで確認)
    refs: [typing-game/prototype/textalive.html]

  - id: onplay-fires-before-user-start
    symptom: >
      スタートボタンを押していないのに onPlay が飛び、「準備中オーバーレイ」が
      勝手に閉じてゲームが始まったように見える（実際は自前の状態は開始していない）。
    cause: 準備段階のメディア初期化でも onPlay が発火することがある。
    solution: >
      onPlay でオーバーレイを閉じるときは、自前の「プレイ中」フラグが立っている
      ことを条件にする（イベント単独を開始の合図にしない）。
    verified: 2026-08-30 (typing-game build 8)
    refs: [typing-game/prototype/textalive.html]

  - id: char-interval-can-be-51ms
    symptom: 文字単位タイミングで判定を作ると、速い箇所で隣の文字を誤判定する。
    cause: >
      歌の文字間隔は等間隔ではなく、実測で最小 51ms まで詰まる
      （中央値 330ms、90%ile 1053ms）。固定の判定ウィンドウでは隣と食い合う。
    solution: >
      判定ウィンドウを隣接ノートとの中間点でクランプする。
      実測では間隔 200ms 未満の箇所が 250 中 41 あり、クランプは必須。
    verified: 2026-08-30 (typing-game、ロンリーランで計測)
    refs: [typing-game/prototype/src/judge.ts]
