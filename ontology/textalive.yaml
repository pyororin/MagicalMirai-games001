# TextAlive App API / Songle の知見（マジカルミライ プロコン向け）
# スキーマは ontology/README.md を参照
domain: textalive-app-api

concepts:
  - id: player
    what: >
      textalive-app-api の Player クラスが全機能のエントリーポイント。
      new Player({ app: { token }, mediaElement, ... }) で初期化し、
      addListener のイベント（onAppReady → onVideoReady → onTimerReady）で準備が進む。
    depends_on: [app-token, required-domains]

  - id: app-token
    what: >
      developer.textalive.jp で開発者登録・アプリ登録して発行するトークン。
      クライアント側に埋め込む前提の公開トークン（公式サンプルもソースに直書き）。
      アプリの URL 登録と紐づくため、公開先 URL が変わったら登録も更新する。

  - id: required-domains
    what: >
      TextAlive アプリが実行時に通信するホスト一覧。ネットワーク制限環境
      （社内プロキシ・sandbox・コンテンツブロッカー）ではすべての許可が必要。
      - api.textalive.jp  … トークン検証、楽曲データ解決(cards/resolve)、歌詞ライセンス(etc/license)
      - api.songle.jp     … Songle API 本体(v2/api.js, song.json)。音楽地図・再生同期の基盤
      - songle.jp         … 歌詞パーサ(lyric_parsers/*.js) と piapro 曲の音源配信(/songs/*/u)。api.songle.jp とは別ホスト扱い
      欠けたときの症状は pitfalls を参照。

  - id: song-load
    what: >
      onAppReady で app.songUrl が空のときだけ createFromSongUrl(曲URL, { video: 版数ID }) を呼ぶ。
      app.songUrl がある（クエリパラメタ or ホスト指定）ときは自動読み込みされるので呼ばない。
      課題曲は毎年、piapro URL + 版数ID（beatId/chordId/repetitiveSegmentId/lyricId/lyricDiffId）で公表される。
    depends_on: [player]

  - id: host-managed
    what: >
      TextAlive ホスト（App Debugger・審査環境）接続時は app.managed が true。
      再生・シーク UI はホストが持つため自前 UI を隠す。シーク・曲差し替えに追従できるよう、
      描画は position 起点の純関数にし、内部状態を最小にする。
    depends_on: [player]

  - id: optional-data
    what: >
      ボーカル音量 getVocalAmplitude() と感情値 getValenceArousal() は、
      Player 初期化オプション vocalAmplitudeEnabled / valenceArousalEnabled を
      true にしておかないと使えない（後から有効化できない）。
      音量の正規化には getMaxVocalAmplitude() を使う。
    depends_on: [player]

  - id: dev-song
    what: >
      動作確認済みの開発用デフォルト曲（公式サンプル textalive-app-basic と同一）。
      マジカルミライ 2025 課題曲「ロンリーラン / 海風太陽」
      songUrl: https://piapro.jp/t/CyPO/20250128183915
      video: { beatId: 4694280, chordId: 2830735, repetitiveSegmentId: 2946483, lyricId: 67815, lyricDiffId: 20659 }
    verified: 2026-08-30 (miku-twintail / typing-game 両企画)

pitfalls:
  - id: card-data-resolver-unavailable
    symptom: >
      画面が「読み込み中」のまま進まず、コンソールに
      "Card data resolver is unavailable" が出る。
    cause: >
      Player 初期化時の api.textalive.jp への接続が失敗したまま
      createFromSongUrl が呼ばれた（ライブラリ内の card マネージャ未初期化）。
      ネットワーク到達性（ドメイン未許可・ブロッカー）が典型原因。コードのバグではないことが多い。
    solution: >
      required-domains の 3 ホストへの到達性を確認する。加えてライブラリ読み込みを
      unpkg 依存にしない（バージョン未固定でブロッカーの影響も受けやすい）。
      npm でバンドルするか、検証済みバージョンを vendor/ に同梱して同一オリジン配信する。
    detection: >
      createFromSongUrl に .catch を付け、window の error / unhandledrejection を拾い、
      15 秒のウォッチドッグで 3 ホストへ fetch 疎通チェックして画面に表示する
      （実装例: miku-twintail/app/src/main.js の「起動診断」）。
      さらに fetch/axios をラップして「失敗した通信の URL と HTTP ステータス」を
      画面に出すと原因が一意に絞れる（実装例: typing-game/prototype/textalive.html）。
      注意: redirect:"manual" の応答は正常でも status 0 に見えるため「HTTP 0」を即異常と判断しない。
    verified: 2026-08-30 (miku-twintail / typing-game)
    note: >
      同じ症状に原因が 2 系統ある。ネットワーク到達性（上記）と、
      クライアント/サーバーのリダイレクト不一致（cards-resolve-302-mismatch）。
      ドメインが全て到達可能なのに出るなら後者を疑う。

  - id: songle-jp-missing
    symptom: >
      曲名・アーティスト名（メタデータ）までは表示されるのに、再生しても
      position が進まない・音が鳴らない。songle.jp/songs/*/u への読み込み失敗。
    cause: >
      songle.jp（ベアドメイン）が未許可。api.songle.jp を許可しただけでは足りない。
      piapro 曲の音源そのものと歌詞パーサは songle.jp から配信される。
    solution: songle.jp を api.songle.jp とは別エントリとして許可する。
    verified: 2026-08-30 (miku-twintail)

  - id: silent-load-failure
    symptom: エラーが何も表示されず「読み込み中」で停止。原因調査に時間がかかる。
    cause: >
      createFromSongUrl の Promise 拒否や初期化中の例外が既定では画面に出ない。
    solution: >
      起動診断をテンプレとして最初から入れる（.catch + unhandledrejection + ウォッチドッグ疎通チェック）。
      新規アプリでは最初のコミットから入れておくこと。
    verified: 2026-08-30 (miku-twintail)

  - id: cards-resolve-redirect
    symptom: 独自プロキシ/中継層を挟むと cards/resolve の後で読み込みが止まる。
    cause: api.textalive.jp/cards/resolve は 302 リダイレクトを返す。中継層がリダイレクトを追従しないと途切れる。
    solution: >
      中継層ではリダイレクト追従（redirect follow）で最終レスポンスを返す。
    verified: 2026-08-30 (miku-twintail, sandbox 中継テスト)

  - id: webaudio-user-gesture
    symptom: 効果音・自前生成音が鳴らない（エラーも出ないことがある）。
    cause: ブラウザの自動再生制限。AudioContext はユーザー操作（クリック/タップ）内で生成/resume が必要。
    solution: 最初の pointerdown / ボタン押下で AudioContext を生成し resume する。
    verified: 2026-08-30 (miku-twintail)

  - id: cards-resolve-302-mismatch
    symptom: >
      ドメイン到達性・トークン・CORS がすべて正常なのに
      createFromSongUrl が即座に "Card data resolver is unavailable" で失敗する。
      診断すると /cards/resolve が「HTTP 0」と記録される。
    cause: >
      クライアント v0.5.2 は /cards/resolve に 200 JSON を期待するが、
      サーバーは 302 リダイレクトを返す（サーバー側の挙動にクライアント最新版が未追従）。
      ライブラリは fetch(..., {redirect:"manual"}) で呼ぶため 302 は status 0 になり、
      status!==200 → {status:"unavailable"} → 例外、という経路をたどる。
      ブラウザから直接叩く場合に顕在化する（中継層がリダイレクトを追従する構成では起きない）。
    solution: |
      失敗時に自前でリダイレクトを追従し、確定したカード URL を createFromCardUrl に渡す。
        player.createFromSongUrl(url, opts).catch(e => {
          if (!String(e).includes("Card data resolver")) throw e;
          return fetch("https://api.textalive.jp/cards/resolve?url=" + encodeURIComponent(url),
                       { redirect: "follow", headers: { "x-ta-app-token": APP_TOKEN } })
            .then(r => { if (!r.ok || !r.url) throw e; return player.createFromCardUrl(r.url, opts); });
        });
      重要: resolve のリダイレクト先はトークンヘッダの有無で変わる。
      ヘッダ有り → 相対 /cards/{id}（api ホストの JSON・CORS 有り・200）。
      ヘッダ無し → https://textalive.jp/cards/{id}（人間向けページ）。必ずトークンを付ける。
    detection: >
      curl -si -H "x-ta-app-token: $TOKEN" \
        "https://api.textalive.jp/cards/resolve?url=<encoded>" | head -5
      で 302 と location を確認する。
    verified: 2026-08-30 (typing-game、302 を再現した E2E で修正を確認)
    refs: [typing-game/prototype/textalive.html]

  - id: token-header-name
    symptom: 自前で API を叩くと {"error":"invalid TextAlive token"} が返る。
    cause: ヘッダ名の誤り。x-textalive-app-token ではなく x-ta-app-token が正しい。
    solution: |
      ヘッダは x-ta-app-token。トークン有効性は次で確認できる。
      curl -s -H "x-ta-app-token: $TOKEN" https://api.textalive.jp/ | jq .app
      app.data.name にアプリ名が返れば有効（app.error があれば無効）。
    verified: 2026-08-30 (typing-game)

  - id: invalid-token-degrades-silently
    symptom: トークンが無効でも例外が出ず、後段で無関係に見えるエラーになる。
    cause: >
      ライブラリはトークン検証に失敗すると console.warn
      （「トークンが正しく指定されていないため動作しません」）を出すだけで劣化続行する。
    solution: 初期化直後に console を確認する。上記 curl で事前検証する。
    verified: 2026-08-30 (typing-game、ライブラリ実装を確認)

  - id: no-reading-data-for-kanji
    symptom: 歌詞の文字を「かな」として扱いたいのに、漢字の読みが取れない。
    cause: >
      TextAlive の文字単位データ（char.text）は表示文字であり、読み（かな）は API から提供されない。
      実測（ロンリーラン）では表示 386 文字中かなは 284 文字（74%）。
    solution: >
      読みが必要なら形態素解析による事前生成が要る。かなだけ扱う設計なら
      カタカナは charCode - 0x60 でひらがなへ正規化し、拗音（きゃ等）は
      前後の文字を結合して 1 音節にまとめる。
    detection: 実データのかな比率と文字間隔は onVideoReady 後に video.firstPhrase を辿って集計できる。
    verified: 2026-08-30 (typing-game、実データ 34 フレーズで計測)
    refs: [typing-game/prototype/src/romaji.ts]

  - id: char-interval-can-be-51ms
    symptom: 文字単位タイミングで判定を作ると、速い箇所で隣の文字を誤判定する。
    cause: >
      歌の文字間隔は等間隔ではなく、実測で最小 51ms まで詰まる
      （中央値 330ms、90%ile 1053ms）。固定の判定ウィンドウでは隣と食い合う。
    solution: >
      判定ウィンドウを隣接ノートとの中間点でクランプする。
      実測では間隔 200ms 未満の箇所が 250 中 41 あり、クランプは必須。
    verified: 2026-08-30 (typing-game、ロンリーランで計測)
    refs: [typing-game/prototype/src/judge.ts]
